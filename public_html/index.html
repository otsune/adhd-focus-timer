<!--
  ==============================================================
  ADHD Focus Timer
  カウントアップ型・集中継続タイマー

  【概要】
  ポモドーロ版から派生した新版。
  カウントダウンではなくカウントアップ方式を採用し、
  自動休憩ではなくユーザー自発の一時中断方式で集中を支援する。
  15分ごとの節目通知で「ここまで来た」を可視化し、
  集計画面で成果を確認できる。

  ダブルクリックで利用可能。
  ==============================================================
-->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Focus Timer</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --bg-elevated: #ffffff;
            --bg-strong: #e8edf5;
            --bg-overlay: rgba(241, 245, 249, 0.96);
            --bg-overlay-strong: rgba(248, 250, 252, 0.97);
            --fg: #18212f;
            --fg-soft: #5b6778;
            --fg-muted: #7a8699;
            --border: #c9d4e3;
            --border-strong: #aeb9ca;
            --accent: #1768d1;
            --accent-strong: #0c8bb0;
            --accent-contrast: #ffffff;
            --accent-soft: rgba(23, 104, 209, 0.12);
            --danger: #c83232;
            --danger-shadow: #891b1b;
            --success: #2f9e44;
            --success-shadow: #1f6f31;
            --focus-ring: #36a3c9;
            --shadow: rgba(15, 23, 42, 0.16);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #000000;
            --bg-elevated: #1a1a1a;
            --bg-strong: #222222;
            --bg-overlay: rgba(0, 0, 0, 0.97);
            --bg-overlay-strong: rgba(0, 0, 0, 0.97);
            --fg: #ffffff;
            --fg-soft: #e0e0e0;
            --fg-muted: #888888;
            --border: #333333;
            --border-strong: #555555;
            --accent: #64b5f6;
            --accent-strong: #4fc3f7;
            --accent-contrast: #000000;
            --accent-soft: rgba(100, 181, 246, 0.15);
            --danger: #d32f2f;
            --danger-shadow: #9a0007;
            --success: #4caf50;
            --success-shadow: #2e7d32;
            --focus-ring: #4fc3f7;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        /* ============== Reset & Base ============== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* ============== Screen System ============== */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* ============== Main Screen ============== */
        #main-screen {
            width: min(100%, 980px);
            margin: 0 auto;
            justify-content: flex-start;
            padding-top: 2vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            max-width: 860px;
            margin: 0 auto 16px auto;
        }

        .task-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-strong);
            padding: 10px 16px;
            border-radius: 16px;
            transition: transform 0.2s;
            position: relative;
        }

        .task-slot:focus-within {
            background: var(--bg-elevated);
            transform: scale(1.02);
        }

        .task-slot input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: clamp(24px, 2.1vw, 32px);
            font-weight: bold;
            outline: none;
            min-width: 0;
        }

        .task-slot input::placeholder {
            color: var(--fg-muted);
            font-size: clamp(20px, 1.8vw, 26px);
        }

        .btn-remove {
            background: transparent;
            color: var(--fg-muted);
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
        }

        .btn-remove:hover {
            color: var(--danger);
            transform: scale(1.2);
        }

        .btn-start-direct {
            background: var(--border-strong);
            color: var(--fg);
            border: none;
            padding: 12px 20px;
            font-size: clamp(20px, 1.7vw, 24px);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-start-direct:hover {
            background: var(--fg-muted);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .btn-add-task {
            background: color-mix(in srgb, var(--bg-elevated) 78%, transparent);
            color: var(--fg);
            border: 2px dashed var(--border-strong);
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add-task:hover {
            background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
            border-color: var(--fg);
        }

        .btn-add-task:disabled {
            background: transparent;
            color: var(--border-strong);
            border-color: var(--border);
            cursor: not-allowed;
        }

        .btn-roulette {
            background: var(--danger);
            color: var(--accent-contrast);
            border: none;
            padding: 18px 40px;
            font-size: clamp(34px, 4vw, 48px);
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 0 var(--danger-shadow);
            transition: 0.1s;
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
            margin-top: auto;
            margin-bottom: 2vh;
        }

        .btn-roulette:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 var(--danger-shadow);
        }

        .btn-roulette:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-summary {
            background: var(--accent-soft);
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-summary:hover {
            background: color-mix(in srgb, var(--accent) 24%, transparent);
        }

        /* ============== Focus Screen ============== */
        #focus-screen {
            position: relative;
        }

        #focus-task-display {
            font-size: 8vw;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
            padding: 0 20px;
            word-break: break-word;
            color: var(--fg-soft);
        }

        #focus-timer-display {
            font-size: 20vw;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            user-select: none;
            color: var(--fg);
            transition: font-size 0.3s ease;
        }

        .focus-buttons {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .btn-pause {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause:hover {
            background: var(--border-strong);
        }

        .btn-finish {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-soft);
            border: 2px solid var(--fg-muted);
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-finish:hover {
            color: var(--fg);
            border-color: var(--fg-soft);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        /* ============== Summary Modal ============== */
        #summary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            overflow-y: auto;
            padding: 40px 20px;
        }

        #summary-modal.active {
            display: flex;
        }

        #summary-modal h2 {
            font-size: 44px;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .summary-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .summary-hero-label {
            font-size: 28px;
            color: var(--fg-muted);
            margin-bottom: 10px;
        }

        .summary-hero-value {
            font-size: 72px;
            color: var(--accent-strong);
            text-shadow: 0 0 30px color-mix(in srgb, var(--accent-strong) 30%, transparent);
            font-variant-numeric: tabular-nums;
        }

        .summary-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .summary-stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 180px;
        }

        .summary-stat-label {
            font-size: 20px;
            color: var(--fg-muted);
            margin-bottom: 8px;
        }

        .summary-stat-value {
            font-size: 36px;
            color: var(--fg-soft);
        }

        .summary-stat-success {
            color: var(--accent-strong);
        }

        .summary-stat-muted {
            color: var(--fg-soft);
        }

        .summary-section {
            width: 80%;
            max-width: 800px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 20px;
        }

        .summary-section-title {
            font-size: 22px;
            color: var(--fg-muted);
            margin-bottom: 15px;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 28px;
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-position {
            color: var(--fg-muted);
            width: 40px;
            flex-shrink: 0;
        }

        .ranking-task {
            color: var(--fg-soft);
            flex: 1;
            margin: 0 15px;
            word-break: break-word;
        }

        .ranking-time {
            color: var(--accent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .best-session-display {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .best-session-display .task-name {
            color: var(--accent-strong);
        }

        .summary-empty {
            text-align: center;
            font-size: 30px;
            color: var(--fg-muted);
            padding: 40px 0;
        }

        .summary-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-close-summary {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-close-summary:hover {
            background: var(--border-strong);
        }

        .btn-export {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-export:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-reset-log {
            background: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-reset-log:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ============== Settings Modal ============== */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #settings-modal.active {
            display: flex;
        }

        #settings-modal h2 {
            font-size: 50px;
            margin-bottom: 30px;
            color: var(--fg-muted);
        }

        .settings-content {
            width: 80%;
            max-width: 600px;
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .settings-row-stack {
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
        }

        .theme-mode-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .theme-option {
            display: block;
            cursor: pointer;
        }

        .theme-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .theme-option-label {
            display: block;
            padding: 14px 18px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-strong);
            color: var(--fg-muted);
            transition: 0.2s;
        }

        .theme-option input:checked + .theme-option-label {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .theme-option input:focus-visible + .theme-option-label {
            outline: 3px solid color-mix(in srgb, var(--focus-ring) 45%, transparent);
            outline-offset: 2px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 70px;
            height: 38px;
        }

        .toggle-switch input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-strong);
            transition: 0.3s;
            border-radius: 38px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 28px;
            width: 28px;
            left: 5px;
            bottom: 5px;
            background-color: var(--bg-elevated);
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked+.toggle-slider {
            background-color: var(--success);
        }

        .toggle-switch input:checked+.toggle-slider:before {
            transform: translateX(32px);
        }

        .btn-save-settings {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 var(--success-shadow);
        }

        .btn-save-settings:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--success-shadow);
        }

        /* ============== Flash Overlay ============== */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        #flash-overlay.flash-red {
            background: rgba(220, 20, 20, 0.75);
            animation: flashAnim 1.8s ease-in-out forwards;
        }

        @keyframes flashAnim {
            0%   { opacity: 0; }
            15%  { opacity: 0.7; }
            30%  { opacity: 0.7; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #flash-overlay.flash-red {
                animation: none;
                opacity: 0;
            }
        }

        /* ============== Milestone Message (Toast) ============== */
        #milestone-message {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-strong);
            border: 2px solid var(--border-strong);
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 32px;
            font-weight: bold;
            color: var(--fg);
            pointer-events: none;
            opacity: 0;
            z-index: 60;
            box-shadow: 0 10px 25px var(--shadow);
            white-space: nowrap;
        }

        #milestone-message.show {
            animation: milestoneAnim 3.5s ease-out forwards;
        }

        @keyframes milestoneAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -30px);
            }
            8% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        /* ============== Undo Toast ============== */
        #undo-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            padding: 15px 25px;
            border-radius: 14px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
            font-size: 22px;
            color: var(--fg-soft);
        }
        #undo-toast.show { display: flex; }
        #undo-toast-btn {
            background: var(--accent-strong);
            color: var(--accent-contrast);
            border: none;
            padding: 8px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ============== Recovery Banner ============== */
        #recovery-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: color-mix(in srgb, var(--bg-elevated) 92%, var(--accent-soft));
            border-bottom: 2px solid var(--accent-strong);
            padding: 20px 30px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 300;
            gap: 20px;
        }

        #recovery-banner.active {
            display: flex;
        }

        #recovery-banner .recovery-text {
            font-size: 24px;
            color: var(--accent-strong);
        }

        #recovery-banner .recovery-actions {
            display: flex;
            gap: 15px;
        }

        .btn-recovery {
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-recovery-resume {
            background: var(--success);
            color: #fff;
        }

        .btn-recovery-discard {
            background: var(--border);
            color: var(--fg-muted);
        }
        /* ============== Mobile Responsiveness ============== */
        @media (max-width: 768px) {
            /* Main Screen */
            .grid-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .task-slot input {
                font-size: 22px;
            }
            .task-slot input::placeholder {
                font-size: 18px;
            }
            .btn-remove {
                font-size: 32px;
            }
            .btn-start-direct {
                padding: 12px 16px;
                font-size: 18px;
            }
            .btn-add-task {
                padding: 12px;
                font-size: 18px;
            }
            .btn-roulette {
                padding: 25px;
                font-size: 28px;
                box-shadow: 0 8px 0 var(--danger-shadow);
                letter-spacing: 1px;
                margin-top: 10px;
            }
            .btn-roulette:active {
                transform: translateY(8px);
                box-shadow: 0 0 0 var(--danger-shadow);
            }
            .controls-row {
                flex-direction: column;
                gap: 10px;
            }
            .controls-row button {
                width: 100%;
                margin: 0;
            }
            .theme-mode-group {
                grid-template-columns: 1fr;
            }
            
            /* Focus Screen */
            #focus-timer-display {
                font-size: 28vw;
            }
            #focus-task-display {
                font-size: 9vw;
            }
            .focus-buttons {
                display: flex;
                flex-direction: column;
                gap: 15px;
                width: 90%;
                max-width: 350px;
                margin: 0 auto;
            }
            .focus-buttons button {
                width: 100%;
                font-size: 24px;
                padding: 18px;
            }

            /* Milestones Toast */
            #milestone-message {
                font-size: 22px;
                padding: 12px 25px;
                width: 90%;
            }

            /* Summary Modal */
            #summary-modal {
                padding: 20px 15px;
                justify-content: flex-start;
            }
            #summary-modal h2 {
                font-size: 32px;
                margin-bottom: 20px;
            }
            .summary-hero-value {
                font-size: 56px;
            }
            .summary-stats {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            .summary-stat-card {
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }
            .summary-section {
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
            }
            .ranking-row {
                font-size: 22px;
            }
            .ranking-time {
                font-size: 18px;
            }
            .best-session-display {
                font-size: 22px;
            }
            .summary-actions {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .summary-actions button, .btn-reset-log {
                width: 100%;
                padding: 15px;
                font-size: 18px;
            }

            /* Settings Modal & Recovery */
            #settings-modal {
                width: 90%;
                padding: 20px;
            }
            #recovery-banner {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .recovery-actions {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .recovery-actions button {
                width: 100%;
            }
        }
        /* ============== v2: Accumulated Time Display ============== */
        #focus-accumulated-display,
        #main-accumulated-display {
            font-size: 22px;
            color: var(--fg-muted);
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        #focus-accumulated-display .acc-label,
        #main-accumulated-display .acc-label {
            color: var(--border-strong);
            font-size: 18px;
            margin-right: 8px;
        }

        #focus-accumulated-display .acc-value,
        #main-accumulated-display .acc-value {
            color: var(--accent-strong);
        }

        /* ============== v2: Away / Meal Buttons ============== */
        .btn-away, .btn-meal {
            background: var(--border-strong);
            color: var(--fg);
            border: none;
            padding: 25px 50px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-away:hover, .btn-meal:hover { background: var(--fg-muted); }

        /* ============== v2: Normal Section ============== */
        #normal-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ============== v2: Recovery Mode ============== */
        #recovery-header {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: baseline;
            width: 100%;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .rh-label {
            font-size: 20px;
            color: var(--border-strong);
            margin-right: 12px;
        }

        .rh-value {
            font-size: 44px;
            font-variant-numeric: tabular-nums;
            color: var(--fg-muted);
        }

        .rh-value.acc {
            color: var(--accent-strong);
        }

        #pause-elapsed-value.over5 {
            color: var(--danger);
            animation: pulse5min 1s ease-in-out infinite alternate;
        }

        @keyframes pulse5min {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        #recovery-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #recovery-status-banner {
            width: 100%;
            text-align: center;
            padding: 16px 20px;
            background: color-mix(in srgb, var(--accent-soft) 90%, var(--bg-elevated));
            border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
            border-radius: 12px;
            font-size: 22px;
            color: var(--accent-strong);
        }
        #recovery-resume-area { width: 100%; }
        #recovery-tasks-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }
        .btn-resume-main {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 40px 60px;
            font-size: 56px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 0 var(--danger-shadow);
            transition: 0.1s;
            letter-spacing: 2px;
        }
        .btn-resume-main:active {
            transform: translateY(12px);
            box-shadow: 0 0 0 var(--danger-shadow);
        }
        .btn-task-recovery {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 20px 30px;
            font-size: 30px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 180px;
        }
        .btn-task-recovery:hover { background: var(--border-strong); }
        .btn-roulette-recovery {
            background: var(--border-strong);
            color: var(--fg);
            border: 2px solid var(--fg-muted);
            padding: 20px 60px;
            font-size: 34px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn-roulette-recovery:hover { background: var(--fg-muted); }
        .btn-finish-recovery {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-soft);
            border: 2px solid var(--fg-muted);
            font-size: 28px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            padding: 18px 40px;
            width: 100%;
            transition: 0.2s;
        }
        .btn-finish-recovery:hover { color: var(--fg); border-color: var(--fg-soft); background: color-mix(in srgb, var(--bg-elevated) 94%, transparent); }
        @media (max-width: 768px) {
            .btn-resume-main { font-size: 36px; padding: 25px 30px; }
            .btn-task-recovery { font-size: 22px; padding: 15px 20px; }
            .btn-roulette-recovery { font-size: 24px; padding: 15px; }
            .btn-finish-recovery { font-size: 22px; padding: 15px 30px; }
            #recovery-status-banner { font-size: 18px; padding: 12px 15px; }
            .btn-away, .btn-meal { padding: 18px 30px; font-size: 24px; }
            #focus-accumulated-display,
            #main-accumulated-display {
                font-size: 22px;
            }
            #focus-accumulated-display .acc-label,
            #main-accumulated-display .acc-label {
                font-size: 17px;
            }
            #recovery-header {
                gap: 12px;
            }
            .rh-label {
                font-size: 16px;
                margin-right: 8px;
            }
            .rh-value {
                font-size: 28px;
            }
        }

        /* ============== Accessibility ============== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .toggle-switch input:focus-visible + .toggle-slider {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <h1 class="sr-only">ADHD Focus Timer</h1>

    <!-- Flash Overlay -->
    <div id="flash-overlay" aria-hidden="true"></div>

    <!-- Milestone Message -->
    <div id="milestone-message" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Undo Toast -->
    <div id="undo-toast" role="alert" aria-live="assertive" aria-atomic="true">
        <span id="undo-toast-text"></span>
        <button id="undo-toast-btn">元に戻す</button>
    </div>

    <!-- Recovery Banner -->
    <div id="recovery-banner" role="alert" aria-live="polite">
        <span class="recovery-text" id="recovery-text"></span>
        <div class="recovery-actions">
            <button class="btn-recovery btn-recovery-resume" id="btn-recovery-resume">再開</button>
            <button class="btn-recovery btn-recovery-discard" id="btn-recovery-discard">破棄</button>
        </div>
    </div>

    <!-- ================= Main Screen ================= -->
    <div id="main-screen" class="screen active">
        <!-- 通常モード -->
        <div id="normal-section">
            <div class="grid-container" id="task-slots"></div>
            <div class="controls-row">
                <button class="btn-add-task" id="btn-add-task">＋ タスクを追加 (最大6個)</button>
                <button class="btn-summary" id="btn-show-summary">📊 今日の成果</button>
                <button class="btn-secondary" id="btn-show-settings">⚙️ 設定</button>
            </div>
            <button class="btn-roulette" id="btn-roulette">決められない時（開始）</button>
            <div id="main-accumulated-display">
                <span class="acc-label" id="main-acc-label">今日の累積集中</span><span class="acc-value" id="main-acc-value-display">—</span>
            </div>
        </div>
        <!-- 復帰モード -->
        <div id="recovery-section" style="display:none">
            <div id="recovery-header">
                <div id="recovery-pause-elapsed">
                    <span class="rh-label" id="recovery-pause-label">中断中</span>
                    <span class="rh-value" id="pause-elapsed-value">00:00</span>
                </div>
                <div id="recovery-today-acc">
                    <span class="rh-label" id="recovery-acc-label">今日の集中</span>
                    <span class="rh-value acc" id="recovery-acc-value">—</span>
                </div>
            </div>
            <div id="recovery-status-banner" aria-live="polite"></div>
            <div id="recovery-resume-area"></div>
            <div id="recovery-tasks-area"></div>
            <button class="btn-roulette-recovery" id="recovery-roulette-btn">ランダム</button>
            <button class="btn-finish-recovery" id="btn-finish-recovery">終了</button>
        </div>
    </div>

    <!-- ================= Focus Screen ================= -->
    <div id="focus-screen" class="screen">
        <div id="focus-task-display">タスク名</div>
        <div id="focus-timer-display" tabindex="-1" role="timer" aria-label="集中時間">00:00</div>
        <div id="focus-accumulated-display">
            <span class="acc-label" id="focus-acc-label">今日の累積集中</span><span class="acc-value" id="focus-acc-value-display">—</span>
        </div>
        <div class="focus-buttons">
            <button class="btn-away" id="btn-away" aria-label="一時中断: 離席">離席</button>
            <button class="btn-meal" id="btn-meal" aria-label="一時中断: 食事">食事</button>
            <button class="btn-finish" id="btn-finish-focus" aria-label="集中を終了">■ 終了</button>
        </div>
    </div>

    <!-- ================= Pause Screen (v2廃止) ================= -->

    <!-- ================= Summary Modal ================= -->
    <div id="summary-modal" role="dialog" aria-modal="true" aria-labelledby="summary-modal-title">
        <h2 id="summary-modal-title">📊 今日の成果</h2>
        <div id="summary-content"></div>
        <div class="summary-actions">
            <button class="btn-close-summary" id="btn-close-summary">閉じる</button>
        </div>

        <button class="btn-reset-log" id="btn-reset-log">ログをリセット</button>
    </div>

    <!-- ================= Settings Modal ================= -->
    <div id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <h2 id="settings-modal-title">⚙️ 設定</h2>
        <div class="settings-content">
            <div class="settings-row settings-row-stack">
                <span class="settings-label" id="settings-theme-label">テーマ</span>
                <div class="theme-mode-group" role="radiogroup" aria-label="テーマ" id="settings-theme-group">
                    <label class="theme-option">
                        <input type="radio" name="setting-theme" value="system" checked>
                        <span class="theme-option-label" id="theme-option-system">システム</span>
                    </label>
                    <label class="theme-option">
                        <input type="radio" name="setting-theme" value="light">
                        <span class="theme-option-label" id="theme-option-light">ライト</span>
                    </label>
                    <label class="theme-option">
                        <input type="radio" name="setting-theme" value="dark">
                        <span class="theme-option-label" id="theme-option-dark">ダーク</span>
                    </label>
                </div>
            </div>
            <div class="settings-row settings-row-stack">
                <span class="settings-label" id="settings-language-label">言語</span>
                <div class="theme-mode-group" role="radiogroup" aria-label="言語" id="settings-language-group">
                    <label class="theme-option">
                        <input type="radio" name="setting-language" value="ja" checked>
                        <span class="theme-option-label" id="language-option-ja">日本語</span>
                    </label>
                    <label class="theme-option">
                        <input type="radio" name="setting-language" value="en">
                        <span class="theme-option-label" id="language-option-en">English</span>
                    </label>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label" id="settings-milestone-label">節目通知</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="setting-milestone" checked aria-label="節目通知">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label" id="settings-sound-label">音通知</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="setting-sound" checked aria-label="音通知">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <button class="btn-save-settings" id="btn-save-settings">保存して閉じる</button>
        <div style="display:flex;gap:15px;margin-top:20px;justify-content:center;">
            <button class="btn-export" id="btn-export-json">📥 JSON エクスポート</button>
            <button class="btn-export" id="btn-export-csv">📥 CSV エクスポート</button>
            <button class="btn-export" id="btn-export-todotxt">📥 todo.txt エクスポート</button>
            <button class="btn-export" id="btn-import-todotxt">📤 todo.txt インポート</button>
        </div>
        <input type="file" id="input-import-todotxt" accept=".txt,.todo.txt,text/plain" hidden>
    </div>

    <!-- ================= Logic ================= -->
        <script type="module">
        import { initApp } from './src/app.js';

        initApp();
    </script>
</body>

</html>
