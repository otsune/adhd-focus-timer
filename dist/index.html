<!--
  ==============================================================
  ADHD Focus Timer
  カウントアップ型・集中継続タイマー

  【概要】
  ポモドーロ版から派生した新版。
  カウントダウンではなくカウントアップ方式を採用し、
  自動休憩ではなくユーザー自発の一時中断方式で集中を支援する。
  15分ごとの節目通知で「ここまで来た」を可視化し、
  集計画面で成果を確認できる。

  ダブルクリックで利用可能。
  ==============================================================
-->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; base-uri 'none'; form-action 'none';">
    <title>ADHD Focus Timer</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --bg-elevated: #ffffff;
            --bg-strong: #e8edf5;
            --bg-overlay: rgba(241, 245, 249, 0.96);
            --bg-overlay-strong: rgba(248, 250, 252, 0.97);
            --fg: #18212f;
            --fg-soft: #5b6778;
            --fg-muted: #7a8699;
            --border: #c9d4e3;
            --border-strong: #aeb9ca;
            --accent: #1768d1;
            --accent-strong: #0c8bb0;
            --accent-contrast: #ffffff;
            --accent-soft: rgba(23, 104, 209, 0.12);
            --danger: #c83232;
            --danger-shadow: #891b1b;
            --success: #2f9e44;
            --success-shadow: #1f6f31;
            --focus-ring: #36a3c9;
            --shadow: rgba(15, 23, 42, 0.16);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #000000;
            --bg-elevated: #1a1a1a;
            --bg-strong: #222222;
            --bg-overlay: rgba(0, 0, 0, 0.97);
            --bg-overlay-strong: rgba(0, 0, 0, 0.97);
            --fg: #ffffff;
            --fg-soft: #e0e0e0;
            --fg-muted: #888888;
            --border: #333333;
            --border-strong: #555555;
            --accent: #64b5f6;
            --accent-strong: #4fc3f7;
            --accent-contrast: #000000;
            --accent-soft: rgba(100, 181, 246, 0.15);
            --danger: #d32f2f;
            --danger-shadow: #9a0007;
            --success: #4caf50;
            --success-shadow: #2e7d32;
            --focus-ring: #4fc3f7;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        /* ============== Reset & Base ============== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* ============== Screen System ============== */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* ============== Main Screen ============== */
        #main-screen {
            width: min(100%, 980px);
            margin: 0 auto;
            justify-content: flex-start;
            padding-top: 2vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            max-width: 860px;
            margin: 0 auto 16px auto;
        }

        .task-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-strong);
            padding: 10px 16px;
            border-radius: 16px;
            transition: transform 0.2s;
            position: relative;
        }

        .task-slot:focus-within {
            background: var(--bg-elevated);
            transform: scale(1.02);
        }

        .task-slot input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: clamp(24px, 2.1vw, 32px);
            font-weight: bold;
            outline: none;
            min-width: 0;
        }

        .task-slot input::placeholder {
            color: var(--fg-muted);
            font-size: clamp(20px, 1.8vw, 26px);
        }

        .btn-remove {
            background: transparent;
            color: var(--fg-muted);
            border: none;
            font-size: 32px;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
        }

        .btn-remove:hover {
            color: var(--danger);
            transform: scale(1.2);
        }

        .btn-start-direct {
            background: var(--border-strong);
            color: var(--fg);
            border: none;
            padding: 12px 20px;
            font-size: clamp(20px, 1.7vw, 24px);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-start-direct:hover {
            background: var(--fg-muted);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .btn-add-task {
            background: color-mix(in srgb, var(--bg-elevated) 78%, transparent);
            color: var(--fg);
            border: 2px dashed var(--border-strong);
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add-task:hover {
            background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
            border-color: var(--fg);
        }

        .btn-add-task:disabled {
            background: transparent;
            color: var(--border-strong);
            border-color: var(--border);
            cursor: not-allowed;
        }

        .btn-roulette {
            background: var(--danger);
            color: var(--accent-contrast);
            border: none;
            padding: 18px 40px;
            font-size: clamp(34px, 4vw, 48px);
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 0 var(--danger-shadow);
            transition: 0.1s;
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
            margin-top: auto;
            margin-bottom: 2vh;
        }

        .btn-roulette:active {
            transform: translateY(10px);
            box-shadow: 0 0 0 var(--danger-shadow);
        }

        .btn-roulette:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-summary {
            background: var(--accent-soft);
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-summary:hover {
            background: color-mix(in srgb, var(--accent) 24%, transparent);
        }

        /* ============== Focus Screen ============== */
        #focus-screen {
            position: relative;
        }

        #focus-task-display {
            font-size: 8vw;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
            padding: 0 20px;
            word-break: break-word;
            color: var(--fg-soft);
        }

        #focus-timer-display {
            font-size: 20vw;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            user-select: none;
            color: var(--fg);
            transition: font-size 0.3s ease;
        }

        .focus-buttons {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .btn-pause {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause:hover {
            background: var(--border-strong);
        }

        .btn-finish {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-soft);
            border: 2px solid var(--fg-muted);
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-finish:hover {
            color: var(--fg);
            border-color: var(--fg-soft);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        /* ============== Summary Modal ============== */
        #summary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            overflow-y: auto;
            padding: 40px 20px;
        }

        #summary-modal.active {
            display: flex;
        }

        #summary-modal h2 {
            font-size: 44px;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .summary-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .summary-hero-label {
            font-size: 28px;
            color: var(--fg-muted);
            margin-bottom: 10px;
        }

        .summary-hero-value {
            font-size: 72px;
            color: var(--accent-strong);
            text-shadow: 0 0 30px color-mix(in srgb, var(--accent-strong) 30%, transparent);
            font-variant-numeric: tabular-nums;
        }

        .summary-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .summary-stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 180px;
        }

        .summary-stat-label {
            font-size: 20px;
            color: var(--fg-muted);
            margin-bottom: 8px;
        }

        .summary-stat-value {
            font-size: 36px;
            color: var(--fg-soft);
        }

        .summary-stat-success {
            color: var(--accent-strong);
        }

        .summary-stat-muted {
            color: var(--fg-soft);
        }

        .summary-section {
            width: 80%;
            max-width: 800px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 20px;
        }

        .summary-section-title {
            font-size: 22px;
            color: var(--fg-muted);
            margin-bottom: 15px;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 28px;
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-position {
            color: var(--fg-muted);
            width: 40px;
            flex-shrink: 0;
        }

        .ranking-task {
            color: var(--fg-soft);
            flex: 1;
            margin: 0 15px;
            word-break: break-word;
        }

        .ranking-time {
            color: var(--accent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .best-session-display {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .best-session-display .task-name {
            color: var(--accent-strong);
        }

        .summary-empty {
            text-align: center;
            font-size: 30px;
            color: var(--fg-muted);
            padding: 40px 0;
        }

        .summary-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-close-summary {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-close-summary:hover {
            background: var(--border-strong);
        }

        .btn-export {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-export:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-reset-log {
            background: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-reset-log:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ============== Settings Modal ============== */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #settings-modal.active {
            display: flex;
        }

        #settings-modal h2 {
            font-size: 50px;
            margin-bottom: 30px;
            color: var(--fg-muted);
        }

        .settings-content {
            width: 80%;
            max-width: 600px;
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .settings-row-stack {
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
        }

        .theme-mode-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .theme-option {
            display: block;
            cursor: pointer;
        }

        .theme-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .theme-option-label {
            display: block;
            padding: 14px 18px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-strong);
            color: var(--fg-muted);
            transition: 0.2s;
        }

        .theme-option input:checked + .theme-option-label {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .theme-option input:focus-visible + .theme-option-label {
            outline: 3px solid color-mix(in srgb, var(--focus-ring) 45%, transparent);
            outline-offset: 2px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 70px;
            height: 38px;
        }

        .toggle-switch input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-strong);
            transition: 0.3s;
            border-radius: 38px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 28px;
            width: 28px;
            left: 5px;
            bottom: 5px;
            background-color: var(--bg-elevated);
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked+.toggle-slider {
            background-color: var(--success);
        }

        .toggle-switch input:checked+.toggle-slider:before {
            transform: translateX(32px);
        }

        .btn-save-settings {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 var(--success-shadow);
        }

        .btn-save-settings:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--success-shadow);
        }

        /* ============== Flash Overlay ============== */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        #flash-overlay.flash-red {
            background: rgba(220, 20, 20, 0.75);
            animation: flashAnim 1.8s ease-in-out forwards;
        }

        @keyframes flashAnim {
            0%   { opacity: 0; }
            15%  { opacity: 0.7; }
            30%  { opacity: 0.7; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #flash-overlay.flash-red {
                animation: none;
                opacity: 0;
            }
        }

        /* ============== Milestone Message (Toast) ============== */
        #milestone-message {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-strong);
            border: 2px solid var(--border-strong);
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 32px;
            font-weight: bold;
            color: var(--fg);
            pointer-events: none;
            opacity: 0;
            z-index: 60;
            box-shadow: 0 10px 25px var(--shadow);
            white-space: nowrap;
        }

        #milestone-message.show {
            animation: milestoneAnim 3.5s ease-out forwards;
        }

        @keyframes milestoneAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -30px);
            }
            8% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        /* ============== Undo Toast ============== */
        #undo-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            padding: 15px 25px;
            border-radius: 14px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
            font-size: 22px;
            color: var(--fg-soft);
        }
        #undo-toast.show { display: flex; }
        #undo-toast-btn {
            background: var(--accent-strong);
            color: var(--accent-contrast);
            border: none;
            padding: 8px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ============== Recovery Banner ============== */
        #recovery-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: color-mix(in srgb, var(--bg-elevated) 92%, var(--accent-soft));
            border-bottom: 2px solid var(--accent-strong);
            padding: 20px 30px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 300;
            gap: 20px;
        }

        #recovery-banner.active {
            display: flex;
        }

        #recovery-banner .recovery-text {
            font-size: 24px;
            color: var(--accent-strong);
        }

        #recovery-banner .recovery-actions {
            display: flex;
            gap: 15px;
        }

        .btn-recovery {
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-recovery-resume {
            background: var(--success);
            color: #fff;
        }

        .btn-recovery-discard {
            background: var(--border);
            color: var(--fg-muted);
        }
        /* ============== Mobile Responsiveness ============== */
        @media (max-width: 768px) {
            /* Main Screen */
            .grid-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .task-slot input {
                font-size: 22px;
            }
            .task-slot input::placeholder {
                font-size: 18px;
            }
            .btn-remove {
                font-size: 32px;
            }
            .btn-start-direct {
                padding: 12px 16px;
                font-size: 18px;
            }
            .btn-add-task {
                padding: 12px;
                font-size: 18px;
            }
            .btn-roulette {
                padding: 25px;
                font-size: 28px;
                box-shadow: 0 8px 0 var(--danger-shadow);
                letter-spacing: 1px;
                margin-top: 10px;
            }
            .btn-roulette:active {
                transform: translateY(8px);
                box-shadow: 0 0 0 var(--danger-shadow);
            }
            .controls-row {
                flex-direction: column;
                gap: 10px;
            }
            .controls-row button {
                width: 100%;
                margin: 0;
            }
            .theme-mode-group {
                grid-template-columns: 1fr;
            }
            
            /* Focus Screen */
            #focus-timer-display {
                font-size: 28vw;
            }
            #focus-task-display {
                font-size: 9vw;
            }
            .focus-buttons {
                display: flex;
                flex-direction: column;
                gap: 15px;
                width: 90%;
                max-width: 350px;
                margin: 0 auto;
            }
            .focus-buttons button {
                width: 100%;
                font-size: 24px;
                padding: 18px;
            }

            /* Milestones Toast */
            #milestone-message {
                font-size: 22px;

/**
 * 経過時間を "MM:SS" or "H:MM:SS" 形式でフォーマットする
 */
function formatElapsedTime(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if (h > 0) {
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/**
 * 秒数を継続時間表記でフォーマットする
 */
function formatDuration(totalSeconds, language = 'ja') {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const isEnglish = language === 'en';

  if (h > 0 && m > 0) {
    return isEnglish ? `${h} hr ${m} min` : h + '時間' + m + '分';
  } else if (h > 0) {
    return isEnglish ? `${h} hr` : h + '時間';
  } else if (m > 0) {
    return isEnglish ? `${m} min` : m + '分';
  } else {
    return isEnglish ? '<1 min' : '1分未満';
  }
}

/**
 * HTMLタグをエスケープする（DOM非依存版）
 */
function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

  );

function trapFocus(modalElement) {
  function handler(e) {
    if (e.key !== 'Tab') return;
    const focusable = getFocusableElements(modalElement);
    if (focusable.length === 0) return;

    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) {
        e.preventDefault();
        last.focus();
      }
    } else if (document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  modalElement.addEventListener('keydown', handler);
  return () => modalElement.removeEventListener('keydown', handler);
}

/**
 * タイムスタンプから日付キー (YYYY-MM-DD) を返す
 * 午前4時を1日の境界とする（4時前は前日扱い）
 */
function getDayKey(date) {
  const d = new Date(date);
  if (d.getHours() < 4) {
    d.setDate(d.getDate() - 1);
  }
  return d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
}

/**
 * 指定時刻以降の次の午前4:00のタイムスタンプを返す
 */
function getNext4AM(fromTimestamp) {
  const d = new Date(fromTimestamp);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 4, 0, 0, 0);
  if (d >= target) {
    target.setDate(target.getDate() + 1);
  }
  return target.getTime();
}

    Number.isFinite(seg.startedAt) && seg.startedAt > 0 &&
    Number.isFinite(seg.endedAt) && seg.endedAt > 0 &&

function safeGetItem(key) {

    return null;

function loadLogs() {
  const data = safeGetItem(STORAGE_KEYS.logs);
  if (!data) return {};
  try {
    const parsed = JSON.parse(data);
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) return {};

    const sanitized = {};
    for (const [key, segments] of Object.entries(parsed)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
      if (!Array.isArray(segments)) continue;
      sanitized[key] = segments.filter(isValidLogSegment);
    }
    return sanitized;
  } catch (e) {
    return {};
  }
}

    return {

}

function playBeep(type) {
  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  if (type === 'start') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(AUDIO_FREQ_START, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(AUDIO_FREQ_START_PEAK, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(AUDIO_GAIN_START, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + AUDIO_START_DURATION);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + AUDIO_START_DURATION);
  } else if (type === 'milestone') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(AUDIO_FREQ_MILESTONE_1, audioCtx.currentTime);
    osc.frequency.setValueAtTime(AUDIO_FREQ_MILESTONE_2, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(AUDIO_GAIN_MILESTONE, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + AUDIO_MILESTONE_DURATION);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + AUDIO_MILESTONE_DURATION);
  }
}

const MILESTONE_INTERVAL = 15 * 60; // 15分（秒）

/**
 * マイルストーン判定を行い、アクション記述を返す純粋関数
 *
 * @param {number} elapsedSeconds - セッション開始からの経過秒数
 * @param {number} lastNotifiedMilestone - 最後に通知した節目（秒）
 * @returns {null|{type: 'flash_chime', newLastNotified: number}|{type: 'sound_message', message: string, newLastNotified: number}}
 */
function getMilestoneAction(elapsedSeconds, lastNotifiedMilestone) {
  const currentMilestone = Math.floor(elapsedSeconds / MILESTONE_INTERVAL) * MILESTONE_INTERVAL;

  if (currentMilestone > 0 && currentMilestone > lastNotifiedMilestone) {
    const milestoneMinutes = currentMilestone / 60;
    const milestoneIndex = currentMilestone / MILESTONE_INTERVAL; // 1, 2, 3, 4...

    if (milestoneIndex % 2 === 1) {
      // 奇数 (15, 45, 75, 105...): 赤フラッシュ＋チャイム音
      return { type: 'flash_chime', newLastNotified: currentMilestone };
    } else {
      // 偶数 (30, 60, 90, 120...): 音＋文言
      return { type: 'sound_message', message: milestoneMinutes + '分経過', newLastNotified: currentMilestone };
    }
  }

  return null;
}

// === src/url-tasks.js ===
const MAX_HASH_LENGTH = 4096;
const MAX_TASKS_FIELD_LENGTH = 2048;

function simpleChecksum(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h = h & h;
  }
  return (h >>> 0).toString(36);
}

function normalizeTasks(tasks) {
  const seen = new Set();
  const normalized = [];

  for (const task of tasks) {
    const value = String(task || '').trim().slice(0, MAX_TASK_NAME_LENGTH);
    if (value === '' || seen.has(value)) continue;
    seen.add(value);
    normalized.push(value);
  }

  return normalized;
}

function getTasksFromHash(hash) {
  const rawHash = String(hash || '').replace(/^#/, '');
  if (!rawHash) return null;

  if (rawHash.length > MAX_HASH_LENGTH) {
    return rawHash.includes('tasks=') ? { tasks: [], replace: false } : null;
  }

  let params;
  try {
    params = new URLSearchParams(rawHash);
  } catch (e) {
    return null;
  }

  if (!params.has('tasks')) return null;

  const tasksParam = params.get('tasks') || '';
  const providedCk = params.get('_ck') || '';
  if (providedCk && providedCk !== simpleChecksum(tasksParam)) {
    return null;
  }
  if (tasksParam.length > MAX_TASKS_FIELD_LENGTH) {
    return { tasks: [], replace: false };
  }

  const replace = params.get('replace') === '1';
  const tasks = normalizeTasks(tasksParam.split('|'));

  return { tasks, replace };
}

function applyTasksFromHash(hash, existingTasks, maxTasks = 6) {
  const parsed = getTasksFromHash(hash);
  if (!parsed) return null;

  const baseTasks = parsed.replace ? [] : normalizeTasks(existingTasks);
  const merged = normalizeTasks(baseTasks.concat(parsed.tasks)).slice(0, maxTasks);

  return {
    tasks: merged.length > 0 ? merged : [''],
    replace: parsed.replace,
    applied: parsed.tasks.length > 0,
    shouldClearHash: true,
  };
}

function buildTasksHash(tasks, replace = false) {
  const combined = tasks.join('|');
  const ck = simpleChecksum(combined);
  const encoded = encodeURIComponent(combined);
  return replace ? `#tasks=${encoded}&_ck=${ck}&replace=1` : `#tasks=${encoded}&_ck=${ck}`;
}

// === src/todotxt.js ===
function isIsoDateToken(token) {
  return /^\d{4}-\d{2}-\d{2}$/.test(token);
}

function parseTodoTxtLine(line) {
  const raw = line.trim();
  if (!raw) return null;

  let remaining = raw;
  let completed = false;
  let completionDate = null;
  let creationDate = null;
  let priority = null;

  if (remaining.startsWith('x ')) {
    completed = true;
    remaining = remaining.slice(2).trim();

    const tokens = remaining.split(/\s+/);
    if (tokens[0] && isIsoDateToken(tokens[0])) {
      completionDate = tokens.shift();
    }
    if (tokens[0] && isIsoDateToken(tokens[0])) {
      creationDate = tokens.shift();
    }
    remaining = tokens.join(' ');
  } else {
    const priorityMatch = remaining.match(/^\(([A-Z])\)\s+/);
    if (priorityMatch) {
      priority = priorityMatch[1];
      remaining = remaining.slice(priorityMatch[0].length);
    }

    const tokens = remaining.split(/\s+/);
    if (tokens[0] && isIsoDateToken(tokens[0])) {
      creationDate = tokens.shift();
      remaining = tokens.join(' ');
    }
  }

  const text = remaining.trim();
  return {
    raw,
    completed,
    priority,
    creationDate,
    completionDate,
    text,
    projects: text.match(/\+\S+/g) || [],
    contexts: text.match(/@\S+/g) || [],
  };
}

function parseTodoTxt(text) {
  return text
    .split(/\r?\n/)
    .map(parseTodoTxtLine)
    .filter(Boolean);
}

function serializeTasksToTodoTxt(tasks) {
  return tasks
    .map((task) => task.trim())
    .filter((task) => task !== '')
    .join('\n');
}

function extractActiveTasksFromTodoTxt(text) {
  return parseTodoTxt(text)
    .filter((item) => !item.completed && item.text !== '')
    .map((item) => item.text);
}

function startFocusTimer(taskName, startTime, tickFn, midnightFn) {
  currentTaskName = taskName;
  focusSegmentStartedAt = startTime || Date.now();
  lastNotifiedMilestone = 0;
  onTickCallback = tickFn;
  onMidnightCallback = midnightFn;
  
  focusIntervalId = setInterval(tickFocusTimer, TIMER_INTERVAL_MS);
}

function stopFocusTimer() {
  if (focusIntervalId) {
    clearInterval(focusIntervalId);
    focusIntervalId = null;
  }
}

function getFocusElapsed() {
  if (!focusSegmentStartedAt) return 0;
  return Math.floor((Date.now() - focusSegmentStartedAt) / 1000);
}

}

}

function isTimerRunning() {
  return focusIntervalId !== null;
}

function tickFocusTimer() {
  const now = Date.now();
  
  if (now >= getNext4AM(focusSegmentStartedAt)) {
    const next4AM = getNext4AM(focusSegmentStartedAt);
    const splitSeconds = Math.round((next4AM - focusSegmentStartedAt) / 1000);
    saveFocusSegment(currentTaskName, focusSegmentStartedAt, next4AM, splitSeconds);
    focusSegmentStartedAt = next4AM;
    lastNotifiedMilestone = 0;
    invalidateFocusTimeCache();
    
    if (onMidnightCallback) {
      onMidnightCallback();
    }
  }
  
  const elapsed = Math.floor((now - focusSegmentStartedAt) / 1000);
  
  if (onTickCallback) {
    onTickCallback(elapsed);
  }
}

  const elapsed = Math.floor((Date.now() - pausedAt) / 1000);
  
  if (onPauseTickCallback) {
    onPauseTickCallback(elapsed);
  }
  
  if (elapsed >= PAUSE_WARNING_SECONDS) {
    if (onPauseWarningCallback) {
      onPauseWarningCallback();
    }
  }
}

// === src/export.js ===
function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportAsJSON(tasks, settings) {
  const logs = loadLogs();
  const exportData = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    tasks,
    settings,
    logs,
  };
  
  const json = JSON.stringify(exportData, null, 2);
  const todayKey = getTodayKey();
  downloadFile(json, interpolateFilename(EXPORT_JSON_PATTERN, todayKey), 'application/json');
}

function exportAsCSV(tasks, settings) {
  const logs = loadLogs();
  const rows = [CSV_HEADER];
  
  for (const [dayKey, segments] of Object.entries(logs)) {
    for (const seg of segments) {
      const startStr = new Date(seg.startedAt).toLocaleString('ja-JP');
      const endStr = new Date(seg.endedAt).toLocaleString('ja-JP');
      const taskName = seg.taskName.replace(/"/g, '""');
      const taskEscaped = /^[=+\-@]/.test(taskName) ? "'" + taskName : '"' + taskName + '"';
      rows.push([dayKey, taskEscaped, startStr, endStr, seg.seconds].join(','));
    }
  }
  
  const csv = rows.join('\n');
  const todayKey = getTodayKey();
  downloadFile('\uFEFF' + csv, interpolateFilename(EXPORT_CSV_PATTERN, todayKey), 'text/csv;charset=utf-8');
}

function exportAsTodoTxt(tasks) {
  const content = serializeTasksToTodoTxt(tasks);
  const todayKey = getTodayKey();
  downloadFile(content, interpolateFilename(EXPORT_TODOTXT_PATTERN, todayKey), 'text/plain;charset=utf-8');
}

async function importFromTodoTxt(file) {
  if (!file) return null;
  
  const text = await file.text();
  const importedTasks = extractActiveTasksFromTodoTxt(text)
    .map(t => t.slice(0, MAX_TASK_NAME_LENGTH));
  
  return importedTasks;
}

function interpolateFilename(pattern, dayKey) {
  return pattern.replace('{day}', dayKey);
}

  if (getTaskCount() > 1) {
    const removedTask = getTaskAt(index);

function showUndoToast(task, index) {
  if (undoTimeout) clearTimeout(undoTimeout);
  undoData = { task, index };

  const toast = document.getElementById('undo-toast');
  const label = task.trim() || tr('taskFallback');
  document.getElementById('undo-toast-text').innerText = tr('undoToast', { task: label });

function undoRemoveTask() {
  if (!undoData) return;
  if (undoTimeout) clearTimeout(undoTimeout);

  const updatedTasks = getTasks();
  updatedTasks.splice(undoData.index, 0, undoData.task);
  setTasks(updatedTasks);
  renderTaskSlots();
  document.getElementById('undo-toast').classList.remove('show');

  undoTimeout = null;

function renderTaskSlots() {
  const container = document.getElementById('task-slots');
  container.innerHTML = '';

  const addBtn = document.getElementById('btn-add-task');
  if (!canAddTask()) {
    addBtn.disabled = true;
    addBtn.innerText = tr('addTaskMax');
  } else {
    addBtn.disabled = false;
    addBtn.innerText = tr('addTask');
  }

  container.style.gridTemplateColumns = '1fr';
  container.style.maxWidth = '860px';
  container.style.margin = '0 auto 16px auto';

  const tasks = getTasks();
  for (let i = 0; i < tasks.length; i++) {

      const removeBtn = document.createElement('button');

      removeBtn.setAttribute('aria-label', tr('taskRemove'));

    input.type = 'text';
    input.placeholder = tr('taskPlaceholder');
    input.setAttribute('aria-label', tr('taskInputAria', { index: i + 1 }));
    input.setAttribute('maxlength', String(MAX_TASK_NAME_LENGTH));
    input.value = tasks[i] || '';
    input.addEventListener('input', (e) => {
      setTaskAt(i, e.target.value.slice(0, MAX_TASK_NAME_LENGTH));

    slot.appendChild(input);

    btn.className = 'btn-start-direct';

      initAudio();

    });
    slot.appendChild(btn);

    clearInterval(rouletteIntervalId);
    rouletteIntervalId = null;
  }

function startRoulette() {
  const validTasks = getValidTasks();
  if (validTasks.length === 0) {
    alert(tr('needTaskAlert'));
    return;
  }

  const isRecoveryMode = _rouGetIsRecoveryMode ? _rouGetIsRecoveryMode() : false;
  const btnId = isRecoveryMode ? 'recovery-roulette-btn' : 'btn-roulette';
  const rouletteBtn = document.getElementById(btnId);
  const originalText = rouletteBtn.innerText;
  rouletteBtn.disabled = true;

  let counter = 0;
  rouletteIntervalId = setInterval(() => {
    if (rouletteIntervalId === null) return;
    rouletteBtn.innerText = validTasks[Math.floor(Math.random() * validTasks.length)];
    counter++;

    if (counter > ROULETTE_CYCLES) {
      clearInterval(rouletteIntervalId);
      rouletteIntervalId = null;
      const selected = validTasks[Math.floor(Math.random() * validTasks.length)];
      rouletteBtn.innerText = originalText;
      rouletteBtn.disabled = false;
      if (_rouOnStartFocus) _rouOnStartFocus(selected);
    }
  }, ROULETTE_INTERVAL_MS);
}

function startFocus(taskName) {
  const wasRecovery = getIsRecoveryMode();
  setIsRecoveryMode(false);

  if (wasRecovery && taskName) {
    const idx = getTasks().indexOf(taskName);
    if (idx > 0) reorderTask(idx, 0);
  }

  const focusStartedAt = Date.now();
  document.getElementById('focus-task-display').innerText = taskName;
  document.getElementById('focus-timer-display').innerText = '00:00';
  updateFocusAccumulatedDisplay(0);
  updateFocusScreenTranslations();
  if (_fsOnSwitchScreen) _fsOnSwitchScreen('focus-screen');

  if (wasRecovery) flashScreen();
  if (getSetting('soundEnabled')) playBeep('start');

  clearActiveState();
  saveActiveState({ status: 'focus', taskName, focusStartedAt });
  if (_fsOnClearAllIntervals) _fsOnClearAllIntervals();
  startFocusTimer(taskName, focusStartedAt, handleFocusTimerTick, handleFocusMidnight);
}

function pauseAs(type) {
  const endedAt = Date.now();
  const startedAt = getFocusStartTime();
  const taskName = getCurrentTaskName();
  const seconds = Math.round((endedAt - startedAt) / 1000);
  saveFocusSegment(taskName, startedAt, endedAt, seconds);
  invalidateFocusTimeCache();
  if (_fsOnClearAllIntervals) _fsOnClearAllIntervals();

  const pausedAt = Date.now();
  setRecoveryState({ taskName, pauseType: type, pausedAt });

  clearActiveState();
  saveActiveState({ status: 'recovery', taskName, pauseType: type, pausedAt });
  if (_fsOnRenderMain) _fsOnRenderMain();
  if (_fsOnSwitchScreen) _fsOnSwitchScreen('main-screen');
}

function finishFocus() {
  const endedAt = Date.now();
  const startedAt = getFocusStartTime();
  const taskName = getCurrentTaskName();
  const seconds = Math.round((endedAt - startedAt) / 1000);
  saveFocusSegment(taskName, startedAt, endedAt, seconds);
  invalidateFocusTimeCache();
  if (_fsOnClearAllIntervals) _fsOnClearAllIntervals();
  clearActiveState();
  showSummary();
}

function checkActiveState() {
  const data = localStorage.getItem(STORAGE_KEYS.activeState);
  if (!data) return;

  let raw;
  try {
    raw = JSON.parse(data);
  } catch (e) {
    clearActiveState();
    return;
  }

  const parsed = parseActiveState(raw);
  if (!parsed) {
    clearActiveState();
    return;
  }

  if (parsed.kind === 'recovery') {
    setRecoveryState({ taskName: parsed.taskName, pauseType: parsed.pauseType, pausedAt: parsed.pausedAt });
    if (_fsOnRenderMain) _fsOnRenderMain();
    return;
  }

  if (_fsOnRenderMain) _fsOnRenderMain();
  if (_fsOnSwitchScreen) _fsOnSwitchScreen('main-screen');

  const banner = document.getElementById('recovery-banner');
  const text = document.getElementById('recovery-text');
  const elapsed = Math.floor((Date.now() - parsed.focusStartedAt) / 1000);
  text.innerText = tr('recoveryBannerActive', { task: parsed.taskName, elapsed: formatElapsedTime(elapsed) });
  banner.classList.add('active');

  document.getElementById('btn-recovery-resume').onclick = () => {
    banner.classList.remove('active');
    initAudio();
    const elapsedSeconds = Math.floor((Date.now() - parsed.focusStartedAt) / 1000);
    document.getElementById('focus-task-display').innerText = parsed.taskName;
    updateFocusAccumulatedDisplay(elapsedSeconds);
    if (_fsOnSwitchScreen) _fsOnSwitchScreen('focus-screen');
    if (_fsOnClearAllIntervals) _fsOnClearAllIntervals();
    startFocusTimer(parsed.taskName, parsed.focusStartedAt, handleFocusTimerTick, handleFocusMidnight);
    setLastMilestone(Math.floor(elapsedSeconds / MILESTONE_INTERVAL) * MILESTONE_INTERVAL);
    saveActiveState({ status: 'focus', taskName: parsed.taskName, focusStartedAt: parsed.focusStartedAt });
    handleFocusTimerTick(elapsedSeconds);
  };

  document.getElementById('btn-recovery-discard').onclick = () => {
    banner.classList.remove('active');
    const endedAt = Date.now();
    const seconds = Math.round((endedAt - parsed.focusStartedAt) / 1000);
    if (seconds > 0) {
      saveFocusSegment(parsed.taskName, parsed.focusStartedAt, endedAt, seconds);
      invalidateFocusTimeCache();
    }
    clearActiveState();
  };
}

// === src/app.js ===
function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach((screen) => screen.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');

  setTimeout(() => {
    if (screenId === 'focus-screen') {
      document.getElementById('focus-timer-display').focus();
    } else if (screenId === 'main-screen') {
      if (getIsRecoveryMode()) {
        const resumeBtn = document.getElementById('btn-resume-last');
        if (resumeBtn) resumeBtn.focus();
      } else {
        const firstInput = document.querySelector('.task-slot input');
        if (firstInput) firstInput.focus();
      }
    }
  }, SCREEN_SWITCH_DELAY_MS);
}

function renderMainScreen() {
  const normalSection = document.getElementById('normal-section');
  const recoverySection = document.getElementById('recovery-section');

  if (getIsRecoveryMode()) {
    normalSection.style.display = 'none';
    recoverySection.style.display = 'flex';
    renderRecoverySection();
  } else {
    normalSection.style.display = '';
    recoverySection.style.display = 'none';
    renderTaskSlots();
    updateMainAccumulatedDisplay();
  }
}

function resetLog() {
  if (confirm(tr('resetConfirm'))) {
    const logs = loadLogs();
    const todayKey = getTodayKey();
    delete logs[todayKey];
    saveLogs(logs);
    invalidateFocusTimeCache();
    showSummary();
  }
}

async function handleImportTodoTxtChange(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const importedTasks = await importFromTodoTxt(file);
  event.target.value = '';

  if (!importedTasks || importedTasks.length === 0) {
    alert(tr('importTodoTxtEmpty'));
    return;
  }

  setTasks(importedTasks);
  renderMainScreen();
  alert(tr('importTodoTxtDone', { count: getTaskCount() }));
}

function clearAllIntervals() {
  stopFocusTimer();
  stopPauseTimer();
  clearRouletteInterval();
}

function handleGlobalKeydown(e) {
  if (e.key !== 'Escape') return;

  const summaryModal = document.getElementById('summary-modal');
  if (summaryModal.classList.contains('active')) {
    e.preventDefault();
    closeSummary();
    return;
  }

  const settingsModal = document.getElementById('settings-modal');
  if (settingsModal.classList.contains('active')) {
    e.preventDefault();
    handleSaveSettings();
    return;
  }

  const recoveryBanner = document.getElementById('recovery-banner');
  if (recoveryBanner.classList.contains('active')) {
    e.preventDefault();
    document.getElementById('btn-recovery-discard').click();
  }
}

function initApp() {
  if (isAppInitialized()) return;
  setAppInitialized(true);

  setTaskUICallbacks({ onStartFocus: startFocus });
  setRouletteCallbacks({ onStartFocus: startFocus, getIsRecoveryMode });
  setSummaryCallbacks({ onRenderMain: renderMainScreen, onSwitchScreen: switchScreen, onResetRecovery: () => setIsRecoveryMode(false) });
  setSettingsCallbacks({ onRenderMain: renderMainScreen });
  setRecoveryCallbacks({ onStartFocus: startFocus, onFlashScreen: flashScreen, onUpdateRecoveryAcc: updateRecoveryAccumulatedDisplay });
  setFocusSessionCallbacks({ onSwitchScreen: switchScreen, onClearAllIntervals: clearAllIntervals, onRenderMain: renderMainScreen });

  initSettings();
  applyTheme(getSetting('themeMode'));
  applyLanguage(getSetting('language'));
  setTasks(loadTasks());
  const initialTasks = getTasks();
  const hashTasks = applyTasksFromHash(window.location.hash, initialTasks, MAX_TASKS);
  if (hashTasks) {
    if (hashTasks.applied) {
      setTasks(hashTasks.tasks);
    }
    if (hashTasks.shouldClearHash) {
      if (window.history?.replaceState) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      } else {
        window.location.hash = '';
      }
    }
  }
  renderMainScreen();

  document.getElementById('btn-roulette').addEventListener('click', () => {
    initAudio();
    startRoulette();
  });
  document.getElementById('btn-add-task').addEventListener('click', addTask);
  document.getElementById('btn-show-summary').addEventListener('click', showSummary);
  document.getElementById('btn-show-settings').addEventListener('click', showSettings);
  document.getElementById('btn-finish-recovery').addEventListener('click', exitRecovery);
  document.getElementById('btn-away').addEventListener('click', () => pauseAs('away'));
  document.getElementById('btn-meal').addEventListener('click', () => pauseAs('meal'));
  document.getElementById('btn-finish-focus').addEventListener('click', finishFocus);
  document.getElementById('btn-close-summary').addEventListener('click', closeSummary);
  document.getElementById('btn-reset-log').addEventListener('click', resetLog);
  document.getElementById('btn-save-settings').addEventListener('click', handleSaveSettings);
  document.getElementById('btn-export-json').addEventListener('click', () => exportAsJSON(getTasks(), getSettings()));
  document.getElementById('btn-export-csv').addEventListener('click', () => exportAsCSV(getTasks(), getSettings()));
  document.getElementById('btn-export-todotxt').addEventListener('click', () => exportAsTodoTxt(getTasks()));
  document.getElementById('btn-import-todotxt').addEventListener('click', () => {
    document.getElementById('input-import-todotxt').click();
  });
  document.getElementById('input-import-todotxt').addEventListener('change', handleImportTodoTxtChange);
  document.getElementById('undo-toast-btn').addEventListener('click', undoRemoveTask);
  document.querySelectorAll('input[name="setting-theme"]').forEach((radio) => {
    radio.addEventListener('change', handleThemePreview);
  });
  document.querySelectorAll('input[name="setting-language"]').forEach((radio) => {
    radio.addEventListener('change', handleLanguagePreview);
  });
  document.addEventListener('keydown', handleGlobalKeydown);
  getSystemThemeMedia().addEventListener('change', () => {
    if (getSetting('themeMode') === 'system') {
      applyTheme('system');
    }
  });

  checkActiveState();
}

// === Main Application ===
if (document.readyState === 'loading') {

            document.addEventListener('DOMContentLoaded', initApp);

        } else {

            initApp();

        }
</script>
