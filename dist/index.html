<!--
  ==============================================================
  ADHD Focus Timer
  カウントアップ型・集中継続タイマー

  【概要】
  ポモドーロ版から派生した新版。
  カウントダウンではなくカウントアップ方式を採用し、
  自動休憩ではなくユーザー自発の一時中断方式で集中を支援する。
  15分ごとの節目通知で「ここまで来た」を可視化し、
  集計画面で成果を確認できる。

  ダブルクリックで利用可能。
  ==============================================================
-->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Focus Timer</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --bg-elevated: #ffffff;
            --bg-strong: #e8edf5;
            --bg-overlay: rgba(241, 245, 249, 0.96);
            --bg-overlay-strong: rgba(248, 250, 252, 0.97);
            --fg: #18212f;
            --fg-soft: #5b6778;
            --fg-muted: #7a8699;
            --border: #c9d4e3;
            --border-strong: #aeb9ca;
            --accent: #1768d1;
            --accent-strong: #0c8bb0;
            --accent-contrast: #ffffff;
            --accent-soft: rgba(23, 104, 209, 0.12);
            --danger: #c83232;
            --danger-shadow: #891b1b;
            --success: #2f9e44;
            --success-shadow: #1f6f31;
            --focus-ring: #36a3c9;
            --shadow: rgba(15, 23, 42, 0.16);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #000000;
            --bg-elevated: #1a1a1a;
            --bg-strong: #222222;
            --bg-overlay: rgba(0, 0, 0, 0.97);
            --bg-overlay-strong: rgba(0, 0, 0, 0.97);
            --fg: #ffffff;
            --fg-soft: #e0e0e0;
            --fg-muted: #888888;
            --border: #333333;
            --border-strong: #555555;
            --accent: #64b5f6;
            --accent-strong: #4fc3f7;
            --accent-contrast: #000000;
            --accent-soft: rgba(100, 181, 246, 0.15);
            --danger: #d32f2f;
            --danger-shadow: #9a0007;
            --success: #4caf50;
            --success-shadow: #2e7d32;
            --focus-ring: #4fc3f7;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        /* ============== Reset & Base ============== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* ============== Screen System ============== */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* ============== Main Screen ============== */
        #main-screen {
            max-width: 1400px;
            margin: 0 auto;
            justify-content: flex-start;
            padding-top: 5vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            margin-bottom: 20px;
        }

        .task-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-strong);
            padding: 15px 25px;
            border-radius: 16px;
            transition: transform 0.2s;
            position: relative;
        }

        .task-slot:focus-within {
            background: var(--bg-elevated);
            transform: scale(1.02);
        }

        .task-slot input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 36px;
            font-weight: bold;
            outline: none;
            min-width: 0;
        }

        .task-slot input::placeholder {
            color: var(--fg-muted);
            font-size: 30px;
        }

        .btn-remove {
            background: transparent;
            color: var(--fg-muted);
            border: none;
            font-size: 40px;
            cursor: pointer;
            padding: 0 10px;
            transition: 0.2s;
        }

        .btn-remove:hover {
            color: var(--danger);
            transform: scale(1.2);
        }

        .btn-start-direct {
            background: var(--border-strong);
            color: var(--fg);
            border: none;
            padding: 15px 30px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-start-direct:hover {
            background: var(--fg-muted);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn-add-task {
            background: color-mix(in srgb, var(--bg-elevated) 78%, transparent);
            color: var(--fg);
            border: 2px dashed var(--border-strong);
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add-task:hover {
            background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
            border-color: var(--fg);
        }

        .btn-add-task:disabled {
            background: transparent;
            color: var(--border-strong);
            border-color: var(--border);
            cursor: not-allowed;
        }

        .btn-roulette {
            background: var(--danger);
            color: var(--accent-contrast);
            border: none;
            padding: 50px 80px;
            font-size: 80px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 15px 0 var(--danger-shadow);
            transition: 0.1s;
            width: 100%;
            text-align: center;
            letter-spacing: 5px;
            margin-top: auto;
            margin-bottom: 5vh;
        }

        .btn-roulette:active {
            transform: translateY(15px);
            box-shadow: 0 0 0 var(--danger-shadow);
        }

        .btn-roulette:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-secondary:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-summary {
            background: var(--accent-soft);
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-summary:hover {
            background: color-mix(in srgb, var(--accent) 24%, transparent);
        }

        /* ============== Focus Screen ============== */
        #focus-screen {
            position: relative;
        }

        #focus-task-display {
            font-size: 8vw;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
            padding: 0 20px;
            word-break: break-word;
            color: var(--fg-soft);
        }

        #focus-timer-display {
            font-size: 20vw;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            user-select: none;
            color: var(--fg);
            transition: font-size 0.3s ease;
        }

        .focus-buttons {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .btn-pause {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause:hover {
            background: var(--border-strong);
        }

        .btn-finish {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-soft);
            border: 2px solid var(--fg-muted);
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-finish:hover {
            color: var(--fg);
            border-color: var(--fg-soft);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        /* ============== Pause Screen ============== */
        #pause-screen {
            background-color: color-mix(in srgb, var(--bg) 94%, #000 6%);
        }

        #pause-title {
            font-size: 6vw;
            margin-bottom: 20px;
            color: var(--fg-muted);
        }

        #pause-timer-display {
            font-size: 15vw;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            user-select: none;
            color: var(--border-strong);
        }

        .pause-buttons {
            display: flex;
            gap: 30px;
            margin-top: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-resume {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--success-shadow);
            transition: 0.1s;
        }

        .btn-resume:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--success-shadow);
        }

        .btn-pause-finish {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 25px 60px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-pause-finish:hover {
            background: var(--border-strong);
        }

        .btn-return-main {
            background: transparent;
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 20px 40px;
            font-size: 30px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
        }

        .btn-return-main:hover {
            color: var(--fg);
            border-color: var(--fg-soft);
        }

        /* ============== Summary Modal ============== */
        #summary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            overflow-y: auto;
            padding: 40px 20px;
        }

        #summary-modal.active {
            display: flex;
        }

        #summary-modal h2 {
            font-size: 44px;
            margin-bottom: 30px;
            color: var(--accent);
        }

        .summary-hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .summary-hero-label {
            font-size: 28px;
            color: var(--fg-muted);
            margin-bottom: 10px;
        }

        .summary-hero-value {
            font-size: 72px;
            color: var(--accent-strong);
            text-shadow: 0 0 30px color-mix(in srgb, var(--accent-strong) 30%, transparent);
            font-variant-numeric: tabular-nums;
        }

        .summary-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .summary-stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 180px;
        }

        .summary-stat-label {
            font-size: 20px;
            color: var(--fg-muted);
            margin-bottom: 8px;
        }

        .summary-stat-value {
            font-size: 36px;
            color: var(--fg-soft);
        }

        .summary-stat-success {
            color: var(--accent-strong);
        }

        .summary-stat-muted {
            color: var(--fg-soft);
        }

        .summary-section {
            width: 80%;
            max-width: 800px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 20px;
        }

        .summary-section-title {
            font-size: 22px;
            color: var(--fg-muted);
            margin-bottom: 15px;
        }

        .ranking-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            font-size: 28px;
        }

        .ranking-row:last-child {
            border-bottom: none;
        }

        .ranking-position {
            color: var(--fg-muted);
            width: 40px;
            flex-shrink: 0;
        }

        .ranking-task {
            color: var(--fg-soft);
            flex: 1;
            margin: 0 15px;
            word-break: break-word;
        }

        .ranking-time {
            color: var(--accent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .best-session-display {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .best-session-display .task-name {
            color: var(--accent-strong);
        }

        .summary-empty {
            text-align: center;
            font-size: 30px;
            color: var(--fg-muted);
            padding: 40px 0;
        }

        .summary-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-close-summary {
            background: var(--border);
            color: var(--fg);
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-close-summary:hover {
            background: var(--border-strong);
        }

        .btn-export {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            color: var(--fg-muted);
            border: 2px solid var(--border-strong);
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-export:hover {
            color: var(--fg);
            border-color: var(--fg-muted);
            background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
        }

        .btn-reset-log {
            background: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--border-strong);
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-reset-log:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* ============== Settings Modal ============== */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay-strong);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        #settings-modal.active {
            display: flex;
        }

        #settings-modal h2 {
            font-size: 50px;
            margin-bottom: 30px;
            color: var(--fg-muted);
        }

        .settings-content {
            width: 80%;
            max-width: 600px;
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 30px;
            color: var(--fg-soft);
        }

        .settings-row-stack {
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
        }

        .theme-mode-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .theme-option {
            display: block;
            cursor: pointer;
        }

        .theme-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .theme-option-label {
            display: block;
            padding: 14px 18px;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-strong);
            color: var(--fg-muted);
            transition: 0.2s;
        }

        .theme-option input:checked + .theme-option-label {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .theme-option input:focus-visible + .theme-option-label {
            outline: 3px solid color-mix(in srgb, var(--focus-ring) 45%, transparent);
            outline-offset: 2px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 70px;
            height: 38px;
        }

        .toggle-switch input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-strong);
            transition: 0.3s;
            border-radius: 38px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 28px;
            width: 28px;
            left: 5px;
            bottom: 5px;
            background-color: var(--bg-elevated);
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked+.toggle-slider {
            background-color: var(--success);
        }

        .toggle-switch input:checked+.toggle-slider:before {
            transform: translateX(32px);
        }

        .btn-save-settings {
            background: var(--success);
            color: #fff;
            border: none;
            padding: 20px 60px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 var(--success-shadow);
        }

        .btn-save-settings:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--success-shadow);
        }

        /* ============== Flash Overlay ============== */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        #flash-overlay.flash-red {
            background: rgba(220, 20, 20, 0.75);
            animation: flashAnim 1.8s ease-in-out forwards;
        }

        @keyframes flashAnim {
            0%   { opacity: 0; }
            15%  { opacity: 0.7; }
            30%  { opacity: 0.7; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #flash-overlay.flash-red {
                animation: none;
                opacity: 0;
            }
        }

        /* ============== Milestone Message (Toast) ============== */
        #milestone-message {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-strong);
            border: 2px solid var(--border-strong);
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 32px;
            font-weight: bold;
            color: var(--fg);
            pointer-events: none;
            opacity: 0;
            z-index: 60;
            box-shadow: 0 10px 25px var(--shadow);
            white-space: nowrap;
        }

        #milestone-message.show {
            animation: milestoneAnim 3.5s ease-out forwards;
        }

        @keyframes milestoneAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -30px);
            }
            8% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        /* ============== Undo Toast ============== */
        #undo-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            padding: 15px 25px;
            border-radius: 14px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
            font-size: 22px;
            color: var(--fg-soft);
        }
        #undo-toast.show { display: flex; }
        #undo-toast-btn {
            background: var(--accent-strong);
            color: var(--accent-contrast);
            border: none;
            padding: 8px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ============== Recovery Banner ============== */
        #recovery-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: color-mix(in srgb, var(--bg-elevated) 92%, var(--accent-soft));
            border-bottom: 2px solid var(--accent-strong);
            padding: 20px 30px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 300;
            gap: 20px;
        }

        #recovery-banner.active {
            display: flex;
        }

        #recovery-banner .recovery-text {
            font-size: 24px;
            color: var(--accent-strong);
        }

        #recovery-banner .recovery-actions {
            display: flex;
            gap: 15px;
        }

        .btn-recovery {
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-recovery-resume {
            background: var(--success);
            color: #fff;
        }

        .btn-recovery-discard {
            background: var(--border);
            color: var(--fg-muted);
        }
        /* ============== Mobile Responsiveness ============== */
        @media (max-width: 768px) {
            /* Main Screen */
            .grid-container {

        <script>
// === src/utils.js ===
/**
 * 経過時間を "MM:SS" or "H:MM:SS" 形式でフォーマットする
 */
function formatElapsedTime(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if (h > 0) {
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

/**
 * 秒数を日本語の継続時間表記でフォーマットする
 */
function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);

  if (h > 0 && m > 0) {
    return h + '時間' + m + '分';
  } else if (h > 0) {
    return h + '時間';
  } else if (m > 0) {
    return m + '分';
  } else {
    return '1分未満';
  }
}

/**
 * HTMLタグをエスケープする（DOM非依存版）
 */
function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// === src/date-utils.js ===
/**
 * タイムスタンプから日付キー (YYYY-MM-DD) を返す
 * 午前4時を1日の境界とする（4時前は前日扱い）
 */
function getDayKey(date) {
  const d = new Date(date);
  if (d.getHours() < 4) {
    d.setDate(d.getDate() - 1);
  }
  return d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
}

/**
 * 今日の日付キーを返す
 */
function getTodayKey() {
  return getDayKey(new Date());
}

/**
 * 指定時刻以降の次の午前4:00のタイムスタンプを返す
 */
function getNext4AM(fromTimestamp) {
  const d = new Date(fromTimestamp);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 4, 0, 0, 0);
  if (d >= target) {
    target.setDate(target.getDate() + 1);
  }
  return target.getTime();
}

// === src/stats.js ===
/**
 * 今日のログの合計集中時間（秒）を返す
 */
function getTotalFocusTime(todayLogs) {
  return todayLogs.reduce((sum, log) => sum + log.seconds, 0);
}

/**
 * 最長の集中区間（秒）を返す
 */
function getLongestFocusSegment(todayLogs) {
  if (todayLogs.length === 0) return 0;
  return Math.max(...todayLogs.map(log => log.seconds));
}

/**
 * 着手回数を返す
 */
function getStartCount(todayLogs) {
  return todayLogs.length;
}

/**
 * ベストセッション（最長のログエントリ）を返す
 */
function getBestSession(todayLogs) {
  if (todayLogs.length === 0) return null;
  const best = todayLogs.reduce((a, b) => a.seconds > b.seconds ? a : b);
  return { task: best.taskName, seconds: best.seconds };
}

/**
 * タスク別の累積集中時間ランキングを返す
 */
function getTaskTimeRanking(todayLogs) {
  const totals = new Map();

  for (const log of todayLogs) {
    const taskName = log.taskName || '名称未設定タスク';
    totals.set(taskName, (totals.get(taskName) || 0) + log.seconds);
  }

  return Array.from(totals.entries())
    .map(([task, seconds]) => ({ task, seconds }))
    .sort((a, b) => b.seconds - a.seconds);
}

/**
 * 最初の着手時刻を "HH:MM" 形式で返す
 */
function getFirstStartTime(todayLogs) {
  if (todayLogs.length === 0) return '—';
  const earliest = Math.min(...todayLogs.map(log => log.startedAt));
  const d = new Date(earliest);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/**
 * 午前中（4:00-11:59）に着手したかどうかを返す
 */
function didStartInMorning(todayLogs) {
  if (todayLogs.length === 0) return false;
  const earliest = Math.min(...todayLogs.map(log => log.startedAt));
  const h = new Date(earliest).getHours();
  return h >= 4 && h < 12;
}

// === src/milestone.js ===
const MILESTONE_INTERVAL = 15 * 60; // 15分（秒）

/**
 * マイルストーン判定を行い、アクション記述を返す純粋関数
 *
 * @param {number} elapsedSeconds - セッション開始からの経過秒数
 * @param {number} lastNotifiedMilestone - 最後に通知した節目（秒）
 * @returns {null|{type: 'flash', newLastNotified: number}|{type: 'sound_message', message: string, newLastNotified: number}}
 */
function getMilestoneAction(elapsedSeconds, lastNotifiedMilestone) {
  const currentMilestone = Math.floor(elapsedSeconds / MILESTONE_INTERVAL) * MILESTONE_INTERVAL;

  if (currentMilestone > 0 && currentMilestone > lastNotifiedMilestone) {
    const milestoneMinutes = currentMilestone / 60;
    const milestoneIndex = currentMilestone / MILESTONE_INTERVAL; // 1, 2, 3, 4...

    if (milestoneIndex % 2 === 1) {
      // 奇数 (15, 45, 75, 105...): 赤フラッシュ
      return { type: 'flash', newLastNotified: currentMilestone };
    } else {
      // 偶数 (30, 60, 90, 120...): 音＋文言
      return { type: 'sound_message', message: milestoneMinutes + '分経過', newLastNotified: currentMilestone };
    }
  }

  return null;
}

// === src/storage.js ===
const STORAGE_KEYS = {
  tasks: 'tasks_v2',
  logs: 'logs_v2',
  settings: 'settings_v2',
  activeState: 'activeState_v2',
};

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function loadLogs() {
  const data = localStorage.getItem(STORAGE_KEYS.logs);
  if (!data) return {};
  try {
    return JSON.parse(data);
  } catch (e) {
    return {};
  }
}

function saveLogs(logs) {
  try {
    localStorage.setItem(STORAGE_KEYS.logs, JSON.stringify(logs));
    return true;
  } catch (e) {
    return false;
  }
}

/**
 * タスク一覧をlocalStorageから読み込んで返す
 */
function loadTasks() {
  const saved = localStorage.getItem(STORAGE_KEYS.tasks);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        return parsed;
      }
    } catch (e) { }
  }
  return [''];
}

/**
 * タスク一覧をlocalStorageに保存する
 */
function saveTasks(tasks) {
  try {
    localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
    return true;
  } catch (e) {
    return false;
  }
}

/**
 * 設定をlocalStorageから読み込んで返す
 */
function loadSettings() {
  const defaults = { milestoneEnabled: true, soundEnabled: true, themeMode: 'system' };
  const saved = localStorage.getItem(STORAGE_KEYS.settings);
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (typeof s.milestoneEnabled === 'boolean') defaults.milestoneEnabled = s.milestoneEnabled;
      if (typeof s.soundEnabled === 'boolean') defaults.soundEnabled = s.soundEnabled;
      if (s.themeMode === 'system' || s.themeMode === 'light' || s.themeMode === 'dark') {
        defaults.themeMode = s.themeMode;
      }
    } catch (e) { }
  }
  return defaults;
}

/**
 * 設定をlocalStorageに保存する
 */
function saveSettings(settings) {
  try {
    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
    return true;
  } catch (e) {
    return false;
  }
}

function saveActiveState(state) {
  try {
    localStorage.setItem(STORAGE_KEYS.activeState, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

function clearActiveState() {
  localStorage.removeItem(STORAGE_KEYS.activeState);
}

/**
 * 集中区間をログに保存する
 */
function saveFocusSegment(taskName, startedAt, endedAt, seconds) {
  if (seconds <= 0) return false;

  const logs = loadLogs();
  const dayKey = getDayKey(new Date(startedAt));

  if (!logs[dayKey]) {
    logs[dayKey] = [];
  }

  logs[dayKey].push({
    id: generateId(),
    taskName: taskName,
    startedAt: startedAt,
    endedAt: endedAt,
    seconds: seconds,
  });

  return saveLogs(logs);
}

// === src/app.js ===
const MAX_TASKS = 6;

let tasks = [''];
let currentTaskName = '';
let focusSegmentStartedAt = null;
let focusIntervalId = null;
let pauseIntervalId = null;
let rouletteIntervalId = null;
let lastNotifiedMilestone = 0;
let appInitialized = false;

let undoTimeout = null;
let undoData = null;

let lastFocusedElement = null;
let currentTrapCleanup = null;

let isRecoveryMode = false;
let lastTaskName = '';
let lastPauseType = '';
let pausedAt = null;

let settings = {
  milestoneEnabled: true,
  soundEnabled: true,
  themeMode: 'system',
};

let audioCtx;
const systemThemeMedia = window.matchMedia('(prefers-color-scheme: light)');

function applyTheme(mode) {
  const resolvedTheme = mode === 'system'
    ? (systemThemeMedia.matches ? 'light' : 'dark')
    : mode;

  document.documentElement.dataset.themeMode = mode;
  document.documentElement.dataset.theme = resolvedTheme;
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBeep(type) {
  if (!audioCtx || !settings.soundEnabled) return;

  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  if (type === 'start') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'milestone') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
  }
}

function updateMainAccumulatedDisplay() {
  const el = document.getElementById('main-acc-value-display');
  if (!el) return;

  const totalSeconds = getTotalFocusTime(getTodayLogs());
  el.innerText = totalSeconds > 0 ? formatDuration(totalSeconds) : '—';
}

function updateFocusAccumulatedDisplay(currentElapsed = 0) {
  const el = document.getElementById('focus-acc-value-display');
  if (!el) return;

  const totalSeconds = getTotalFocusTime(getTodayLogs()) + currentElapsed;
  el.innerText = totalSeconds > 0 ? formatDuration(totalSeconds) : '—';
}

function updateRecoveryAccumulatedDisplay() {
  const el = document.getElementById('recovery-acc-value');
  if (!el) return;

  const totalSeconds = getTotalFocusTime(getTodayLogs());
  el.innerText = totalSeconds > 0 ? formatDuration(totalSeconds) : '—';
}

function addTask() {
  if (tasks.length < MAX_TASKS) {
    tasks.push('');
    saveTasks(tasks);
    renderTaskSlots();
    setTimeout(() => {
      const inputs = document.querySelectorAll('.task-slot input');
      if (inputs.length > 0) inputs[inputs.length - 1].focus();
    }, 50);
  }
}

function removeTask(index) {
  if (tasks.length > 1) {
    const removedTask = tasks[index];
    const removedIndex = index;
    tasks.splice(index, 1);
    saveTasks(tasks);
    renderTaskSlots();
    showUndoToast(removedTask, removedIndex);
  }
}

function showUndoToast(task, index) {
  if (undoTimeout) clearTimeout(undoTimeout);
  undoData = { task, index };

  const toast = document.getElementById('undo-toast');
  const label = task.trim() || 'タスク';
  document.getElementById('undo-toast-text').innerText = '「' + label + '」を削除';
  toast.classList.add('show');

  undoTimeout = setTimeout(() => {
    toast.classList.remove('show');
    undoData = null;
    undoTimeout = null;
  }, 5000);
}

function undoRemoveTask() {
  if (!undoData) return;
  if (undoTimeout) clearTimeout(undoTimeout);

  tasks.splice(undoData.index, 0, undoData.task);
  saveTasks(tasks);
  renderTaskSlots();
  document.getElementById('undo-toast').classList.remove('show');
  undoData = null;
  undoTimeout = null;
}

function renderTaskSlots() {
  const container = document.getElementById('task-slots');
  container.innerHTML = '';

  const addBtn = document.getElementById('btn-add-task');
  if (tasks.length >= MAX_TASKS) {
    addBtn.disabled = true;
    addBtn.innerText = '最大数 (6個) に達しています';
  } else {
    addBtn.disabled = false;
    addBtn.innerText = '＋ タスクを追加 (最大6個)';
  }

  if (tasks.length === 1) {
    container.style.gridTemplateColumns = '1fr';
    container.style.maxWidth = '700px';
    container.style.margin = '0 auto 20px auto';
  } else {
    container.style.gridTemplateColumns = '1fr 1fr';
    container.style.maxWidth = '100%';
    container.style.margin = '0 0 20px 0';
  }

  for (let i = 0; i < tasks.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'task-slot';

    if (tasks.length > 1) {
      const removeBtn = document.createElement('button');
      removeBtn.className = 'btn-remove';
      removeBtn.innerHTML = '×';
      removeBtn.title = 'タスクを削除';
      removeBtn.setAttribute('aria-label', 'タスクを削除');
      removeBtn.addEventListener('click', () => removeTask(i));
      slot.appendChild(removeBtn);
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'タスクを入力...';
    input.setAttribute('aria-label', 'タスク' + (i + 1) + '入力');
    input.value = tasks[i] || '';
    input.addEventListener('input', (e) => {
      tasks[i] = e.target.value;
      saveTasks(tasks);
    });
    slot.appendChild(input);

    const btn = document.createElement('button');
    btn.className = 'btn-start-direct';
    btn.innerText = '開始 ▶';
    btn.addEventListener('click', () => {
      initAudio();
      const taskName = input.value.trim() || '名称未設定タスク';
      startFocus(taskName);
    });
    slot.appendChild(btn);
    container.appendChild(slot);
  }
}

function startRoulette() {
  const validTasks = tasks.map((t) => t.trim()).filter((t) => t !== '');
  if (validTasks.length === 0) {
    alert('少なくとも1つタスクを入力してください！');
    return;
  }

  const btnId = isRecoveryMode ? 'recovery-roulette-btn' : 'btn-roulette';
  const rouletteBtn = document.getElementById(btnId);
  const originalText = rouletteBtn.innerText;
  rouletteBtn.disabled = true;

  let counter = 0;
  rouletteIntervalId = setInterval(() => {
    if (rouletteIntervalId === null) return;
    rouletteBtn.innerText = validTasks[Math.floor(Math.random() * validTasks.length)];
    counter++;

    if (counter > 15) {
      clearInterval(rouletteIntervalId);
      rouletteIntervalId = null;
      const selected = validTasks[Math.floor(Math.random() * validTasks.length)];
      rouletteBtn.innerText = originalText;
      rouletteBtn.disabled = false;
      startFocus(selected);
    }
  }, 60);
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach((screen) => screen.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');

  setTimeout(() => {
    if (screenId === 'focus-screen') {
      document.getElementById('focus-timer-display').focus();
    } else if (screenId === 'main-screen') {
      if (isRecoveryMode) {
        const resumeBtn = document.getElementById('btn-resume-last');
        if (resumeBtn) resumeBtn.focus();
      } else {
        const firstInput = document.querySelector('.task-slot input');
        if (firstInput) firstInput.focus();
      }
    }
  }, 100);
}

function startFocus(taskName) {
  const wasRecovery = isRecoveryMode;
  isRecoveryMode = false;

  currentTaskName = taskName;
  focusSegmentStartedAt = Date.now();
  lastNotifiedMilestone = 0;

  document.getElementById('focus-task-display').innerText = currentTaskName;
  document.getElementById('focus-timer-display').innerText = '00:00';
  updateFocusAccumulatedDisplay(0);
  switchScreen('focus-screen');

  if (wasRecovery) {
    flashScreen();
  }
  playBeep('start');

  clearActiveState();
  saveActiveState({ status: 'focus', taskName: currentTaskName, focusStartedAt: focusSegmentStartedAt });
  clearAllIntervals();
  focusIntervalId = setInterval(tickFocusTimer, 1000);
}

function tickFocusTimer() {
  const now = Date.now();
  const next4AM = getNext4AM(focusSegmentStartedAt);

  if (now >= next4AM) {
    const splitSeconds = Math.round((next4AM - focusSegmentStartedAt) / 1000);
    saveFocusSegment(currentTaskName, focusSegmentStartedAt, next4AM, splitSeconds);
    focusSegmentStartedAt = next4AM;
    lastNotifiedMilestone = 0;
    saveActiveState({ status: 'focus', taskName: currentTaskName, focusStartedAt: focusSegmentStartedAt });
    showMilestoneMessage('日付が変わりました');
  }

  const elapsed = Math.floor((now - focusSegmentStartedAt) / 1000);
  document.getElementById('focus-timer-display').innerText = formatElapsedTime(elapsed);
  updateFocusAccumulatedDisplay(elapsed);
  if (settings.milestoneEnabled) handleFocusMilestone(elapsed);
}

function pauseAs(type) {
  const endedAt = Date.now();
  const seconds = Math.round((endedAt - focusSegmentStartedAt) / 1000);
  saveFocusSegment(currentTaskName, focusSegmentStartedAt, endedAt, seconds);
  clearAllIntervals();

  isRecoveryMode = true;
  lastTaskName = currentTaskName;
  lastPauseType = type;
  pausedAt = Date.now();

  clearActiveState();
  saveActiveState({ status: 'recovery', taskName: currentTaskName, pauseType: type, pausedAt });
  renderMainScreen();
  switchScreen('main-screen');
}

function finishFocus() {
  const endedAt = Date.now();
  const seconds = Math.round((endedAt - focusSegmentStartedAt) / 1000);
  saveFocusSegment(currentTaskName, focusSegmentStartedAt, endedAt, seconds);
  clearAllIntervals();
  clearActiveState();
  showSummary();
}

function renderMainScreen() {
  const normalSection = document.getElementById('normal-section');
  const recoverySection = document.getElementById('recovery-section');

  if (isRecoveryMode) {
    normalSection.style.display = 'none';
    recoverySection.style.display = 'flex';
    renderRecoverySection();
  } else {
    normalSection.style.display = '';
    recoverySection.style.display = 'none';
    renderTaskSlots();
    updateMainAccumulatedDisplay();
  }
}

function renderRecoverySection() {
  const banner = document.getElementById('recovery-status-banner');
  if (lastPauseType === 'away') {
    banner.innerText = '🚶 離席中 — 戻ったらタスクを選んで再開しましょう';
  } else if (lastPauseType === 'meal') {
    banner.innerText = '🍽️ 食事中 — 戻ったらタスクを選んで再開しましょう';
  } else {
    banner.innerText = '⏸️ 一時中断中 — タスクを選んで再開しましょう';
  }

  const resumeArea = document.getElementById('recovery-resume-area');
  resumeArea.innerHTML = '';
  const resumeBtn = document.createElement('button');
  resumeBtn.className = 'btn-resume-main';
  resumeBtn.id = 'btn-resume-last';
  resumeBtn.innerText = lastTaskName + ' を再開';
  resumeBtn.addEventListener('click', () => {
    initAudio();
    startFocus(lastTaskName);
  });
  resumeArea.appendChild(resumeBtn);

  const tasksArea = document.getElementById('recovery-tasks-area');
  tasksArea.innerHTML = '';
  tasks
    .map((task) => task.trim())
    .filter((task) => task !== '')
    .forEach((name) => {
      const btn = document.createElement('button');
      btn.className = 'btn-task-recovery';
      btn.innerText = name;
      btn.addEventListener('click', () => {
        initAudio();
        startFocus(name);
      });
      tasksArea.appendChild(btn);
    });

  const rouletteBtn = document.getElementById('recovery-roulette-btn');
  rouletteBtn.onclick = () => {
    initAudio();
    startRoulette();
  };

  updateRecoveryAccumulatedDisplay();
  startPauseTimer();
}

function exitRecovery() {
  isRecoveryMode = false;
  lastTaskName = '';
  lastPauseType = '';
  pausedAt = null;
  stopPauseTimer();
  clearActiveState();
  showSummary();
}

function startPauseTimer() {
  stopPauseTimer();
  tickPauseTimer();
  pauseIntervalId = setInterval(tickPauseTimer, 1000);
}

function tickPauseTimer() {
  if (!pausedAt) return;

  const elapsed = Math.floor((Date.now() - pausedAt) / 1000);
  const el = document.getElementById('pause-elapsed-value');
  if (!el) return;

  el.innerText = formatElapsedTime(elapsed);
  if (elapsed >= 300) {
    if (!el.classList.contains('over5')) {
      el.classList.add('over5');
      flashScreen();
    }
  } else {
    el.classList.remove('over5');
  }
}

function stopPauseTimer() {
  if (pauseIntervalId) {
    clearInterval(pauseIntervalId);
    pauseIntervalId = null;
  }

  const el = document.getElementById('pause-elapsed-value');
  if (el) {
    el.classList.remove('over5');
    el.innerText = '00:00';
  }
}

function handleFocusMilestone(elapsedSeconds) {
  const action = getMilestoneAction(elapsedSeconds, lastNotifiedMilestone);
  if (!action) return;

  lastNotifiedMilestone = action.newLastNotified;
  if (action.type === 'flash') {
    flashScreen();
  } else if (action.type === 'sound_message') {
    playBeep('milestone');
    showMilestoneMessage(action.message);
  }
}

function flashScreen() {
  const overlay = document.getElementById('flash-overlay');
  overlay.classList.remove('flash-red');
  void overlay.offsetWidth;
  overlay.classList.add('flash-red');
  setTimeout(() => overlay.classList.remove('flash-red'), 1900);
}

function showMilestoneMessage(text) {
  const el = document.getElementById('milestone-message');
  el.classList.remove('show');
  el.innerText = text;
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3600);
}

function getTodayLogs() {
  const logs = loadLogs();
  const todayKey = getTodayKey();
  return logs[todayKey] || [];
}

function showSummary() {
  lastFocusedElement = document.activeElement;
  const todayLogs = getTodayLogs();
  const container = document.getElementById('summary-content');

  if (todayLogs.length === 0) {
    container.innerHTML = '<div class="summary-empty">まだ記録がありません。<br>タスクを選んで集中を始めましょう。</div>';
  } else {
    const totalSeconds = getTotalFocusTime(todayLogs);
    const longestSeconds = getLongestFocusSegment(todayLogs);
    const startCount = getStartCount(todayLogs);
    const bestSession = getBestSession(todayLogs);
    const taskRanking = getTaskTimeRanking(todayLogs);
    const firstStartTime = getFirstStartTime(todayLogs);
    const inMorning = didStartInMorning(todayLogs);

    let html = '';
    html += '<div class="summary-hero">';
    html += '<div class="summary-hero-label">累積集中時間</div>';
    html += '<div class="summary-hero-value">' + formatDuration(totalSeconds) + '</div>';
    html += '</div>';

    html += '<div class="summary-stats">';
    html += '<div class="summary-stat-card"><div class="summary-stat-label">最初の着手</div><div class="summary-stat-value">' + firstStartTime + '</div></div>';
    html += '<div class="summary-stat-card"><div class="summary-stat-label">午前中に着手</div><div class="summary-stat-value ' + (inMorning ? 'summary-stat-success' : 'summary-stat-muted') + '">' + (inMorning ? '✓ できた' : '—') + '</div></div>';
    html += '<div class="summary-stat-card"><div class="summary-stat-label">最長連続</div><div class="summary-stat-value">' + formatDuration(longestSeconds) + '</div></div>';
    html += '<div class="summary-stat-card"><div class="summary-stat-label">着手回数</div><div class="summary-stat-value">' + startCount + '回</div></div>';
    html += '</div>';

    if (bestSession) {
      html += '<div class="summary-section">';
      html += '<div class="summary-section-title">今日のベストセッション</div>';
      html += '<div class="best-session-display">';
      html += '<span class="task-name">' + escapeHtml(bestSession.task) + '</span> ';
      html += formatDuration(bestSession.seconds);
      html += '</div></div>';
    }

    if (taskRanking.length > 0) {
      html += '<div class="summary-section">';
      html += '<div class="summary-section-title">タスク別 累積集中時間</div>';
      taskRanking.forEach((item, index) => {
        const medals = ['🥇', '🥈', '🥉'];
        const position = index < medals.length ? medals[index] : String(index + 1) + '.';
        html += '<div class="ranking-row">';
        html += '<span class="ranking-position">' + position + '</span>';
        html += '<span class="ranking-task">' + escapeHtml(item.task) + '</span>';
        html += '<span class="ranking-time">' + formatDuration(item.seconds) + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }

    container.innerHTML = html;
  }

  const summaryModal = document.getElementById('summary-modal');
  summaryModal.classList.add('active');
  currentTrapCleanup = trapFocus(summaryModal);
  document.getElementById('btn-close-summary').focus();
}

function closeSummary() {
  if (currentTrapCleanup) {
    currentTrapCleanup();
    currentTrapCleanup = null;
  }
  document.getElementById('summary-modal').classList.remove('active');
  isRecoveryMode = false;
  renderMainScreen();
  switchScreen('main-screen');

  if (lastFocusedElement && lastFocusedElement.isConnected) {
    lastFocusedElement.focus();
  } else {
    document.getElementById('btn-show-summary').focus();
  }
  lastFocusedElement = null;
}

function resetLog() {
  if (confirm('今日の集中ログをリセットしますか？')) {
    const logs = loadLogs();
    const todayKey = getTodayKey();
    delete logs[todayKey];
    saveLogs(logs);
    showSummary();
  }
}

function exportLogsAsJSON() {
  const logs = loadLogs();
  const exportData = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    tasks,
    settings,
    logs,
  };

  const json = JSON.stringify(exportData, null, 2);
  const todayKey = getTodayKey();
  downloadFile(json, 'adhd_focus_log_' + todayKey + '.json', 'application/json');
}

function exportLogsAsCSV() {
  const logs = loadLogs();
  const rows = ['日付,タスク名,開始時刻,終了時刻,集中秒数'];

  for (const [dayKey, segments] of Object.entries(logs)) {
    for (const seg of segments) {
      const startStr = new Date(seg.startedAt).toLocaleString('ja-JP');
      const endStr = new Date(seg.endedAt).toLocaleString('ja-JP');
      const taskEscaped = '"' + seg.taskName.replace(/"/g, '""') + '"';
      rows.push([dayKey, taskEscaped, startStr, endStr, seg.seconds].join(','));
    }
  }

  const csv = rows.join('\n');
  const todayKey = getTodayKey();
  downloadFile('\uFEFF' + csv, 'adhd_focus_log_' + todayKey + '.csv', 'text/csv;charset=utf-8');
}

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showSettings() {
  lastFocusedElement = document.activeElement;
  document.getElementById('setting-milestone').checked = settings.milestoneEnabled;
  document.getElementById('setting-sound').checked = settings.soundEnabled;
  const checkedThemeRadio = document.querySelector(`input[name="setting-theme"][value="${settings.themeMode}"]`);
  if (checkedThemeRadio) checkedThemeRadio.checked = true;

  const settingsModal = document.getElementById('settings-modal');
  settingsModal.classList.add('active');
  currentTrapCleanup = trapFocus(settingsModal);
  const firstThemeRadio = document.querySelector('input[name="setting-theme"]:checked') || document.getElementById('setting-milestone');
  firstThemeRadio.focus();
}

function handleSaveSettings() {
  if (currentTrapCleanup) {
    currentTrapCleanup();
    currentTrapCleanup = null;
  }
  settings.milestoneEnabled = document.getElementById('setting-milestone').checked;
  settings.soundEnabled = document.getElementById('setting-sound').checked;
  settings.themeMode = document.querySelector('input[name="setting-theme"]:checked')?.value || 'system';
  saveSettings(settings);
  applyTheme(settings.themeMode);
  document.getElementById('settings-modal').classList.remove('active');

  if (lastFocusedElement && lastFocusedElement.isConnected) {
    lastFocusedElement.focus();
  } else {
    document.getElementById('btn-show-settings').focus();
  }
  lastFocusedElement = null;
}

function checkActiveState() {
  const data = localStorage.getItem(STORAGE_KEYS.activeState);
  if (!data) return;

  try {
    const state = JSON.parse(data);
    if (!state || !state.status) {
      clearActiveState();
      return;
    }

    if (state.status === 'recovery') {
      isRecoveryMode = true;
      lastTaskName = state.taskName || '';
      lastPauseType = state.pauseType || '';
      pausedAt = state.pausedAt || null;
      renderMainScreen();
      return;
    }

    if (state.status !== 'focus') {
      clearActiveState();
      return;
    }

    const banner = document.getElementById('recovery-banner');
    const text = document.getElementById('recovery-text');
    const elapsed = Math.floor((Date.now() - state.focusStartedAt) / 1000);
    text.innerText = '集中中の状態が残っています（' + state.taskName + ' / ' + formatElapsedTime(elapsed) + '経過）';
    banner.classList.add('active');

    document.getElementById('btn-recovery-resume').onclick = () => {
      banner.classList.remove('active');
      initAudio();
      currentTaskName = state.taskName;
      focusSegmentStartedAt = state.focusStartedAt;
      const elapsedSeconds = Math.floor((Date.now() - focusSegmentStartedAt) / 1000);
      lastNotifiedMilestone = Math.floor(elapsedSeconds / MILESTONE_INTERVAL) * MILESTONE_INTERVAL;
      document.getElementById('focus-task-display').innerText = currentTaskName;
      updateFocusAccumulatedDisplay(elapsedSeconds);
      switchScreen('focus-screen');
      clearAllIntervals();
      focusIntervalId = setInterval(tickFocusTimer, 1000);
      saveActiveState({ status: 'focus', taskName: currentTaskName, focusStartedAt: focusSegmentStartedAt });
      tickFocusTimer();
    };

    document.getElementById('btn-recovery-discard').onclick = () => {
      banner.classList.remove('active');
      if (state.focusStartedAt) {
        const endedAt = Date.now();
        const seconds = Math.round((endedAt - state.focusStartedAt) / 1000);
        if (seconds > 0) saveFocusSegment(state.taskName, state.focusStartedAt, endedAt, seconds);
      }
      clearActiveState();
    };
  } catch (e) {
    clearActiveState();
  }
}

function clearAllIntervals() {
  if (focusIntervalId) {
    clearInterval(focusIntervalId);
    focusIntervalId = null;
  }
  stopPauseTimer();
  if (rouletteIntervalId) {
    clearInterval(rouletteIntervalId);
    rouletteIntervalId = null;
  }
}

function getFocusableElements(container) {
  const els = container.querySelectorAll(
    'button:not([disabled]):not([tabindex="-1"]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
  );
  return Array.from(els).filter((el) => el.offsetParent !== null || el.closest('.toggle-switch'));
}

function trapFocus(modalElement) {
  function handler(e) {
    if (e.key !== 'Tab') return;
    const focusable = getFocusableElements(modalElement);
    if (focusable.length === 0) return;

    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) {
        e.preventDefault();
        last.focus();
      }
    } else if (document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  modalElement.addEventListener('keydown', handler);
  return () => modalElement.removeEventListener('keydown', handler);
}

function handleGlobalKeydown(e) {
  if (e.key !== 'Escape') return;

  const summaryModal = document.getElementById('summary-modal');
  if (summaryModal.classList.contains('active')) {
    e.preventDefault();
    closeSummary();
    return;
  }

  const settingsModal = document.getElementById('settings-modal');
  if (settingsModal.classList.contains('active')) {
    e.preventDefault();
    handleSaveSettings();
    return;
  }

  const recoveryBanner = document.getElementById('recovery-banner');
  if (recoveryBanner.classList.contains('active')) {
    e.preventDefault();
    document.getElementById('btn-recovery-discard').click();
  }
}

function initApp() {
  if (appInitialized) return;
  appInitialized = true;

  settings = loadSettings();
  applyTheme(settings.themeMode);
  tasks = loadTasks();
  renderMainScreen();

  document.getElementById('btn-roulette').addEventListener('click', () => {
    initAudio();
    startRoulette();
  });
  document.getElementById('btn-add-task').addEventListener('click', addTask);
  document.getElementById('btn-show-summary').addEventListener('click', showSummary);
  document.getElementById('btn-show-settings').addEventListener('click', showSettings);
  document.getElementById('btn-finish-recovery').addEventListener('click', exitRecovery);
  document.getElementById('btn-away').addEventListener('click', () => pauseAs('away'));
  document.getElementById('btn-meal').addEventListener('click', () => pauseAs('meal'));
  document.getElementById('btn-finish-focus').addEventListener('click', finishFocus);
  document.getElementById('btn-close-summary').addEventListener('click', closeSummary);
  document.getElementById('btn-reset-log').addEventListener('click', resetLog);
  document.getElementById('btn-save-settings').addEventListener('click', handleSaveSettings);
  document.getElementById('btn-export-json').addEventListener('click', exportLogsAsJSON);
  document.getElementById('btn-export-csv').addEventListener('click', exportLogsAsCSV);
  document.getElementById('undo-toast-btn').addEventListener('click', undoRemoveTask);
  document.addEventListener('keydown', handleGlobalKeydown);
  systemThemeMedia.addEventListener('change', () => {
    if (settings.themeMode === 'system') {
      applyTheme('system');
    }
  });

  checkActiveState();
}

// === Main Application ===
if (document.readyState === 'loading') {

            document.addEventListener('DOMContentLoaded', initApp);

        } else {

            initApp();

        }
</script>
